        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              regular:
                summary: Regular Query
                value:
                  query:
                    query: a sample query
                    boost: 1
                  size: 10
                  from: 0
                  highlight: null
                  fields: null
                  facets: null
                  explain: false
              options:
                summary: Query with Options
                value:
                  ctl:
                    timeout: 10000
                    consistency:
                      level: at_plus
                      vectors:
                        customerIndex:
                          '0': 123
                          1/a0b1c2: 234
                  query:
                    query: alice smith
                    boost: 1
                  size: 10
                  from: 20
                  highlight:
                    style: null
                    fields: null
                  fields:
                    - '*'
                  facets: null
                  explain: true
              hybrid:
                summary: Hybrid Query
                value:
                  fields:
                    - '*'
                  query:
                    min: 70
                    max: 80
                    inclusive_min: false
                    inclusive_max: true
                    field: brightness
                  knn:
                    - k: 10
                      field: colorvect_dot
                      vector:
                        - 0.707106781186548
                        - 0
                        - 0.707106781186548
                  size: 10
