openapi: 3.0.3
info:
  title: Couchbase Search Index Management and Monitoring API
  description: |-
    The Search Indexing REST API is provided by the Search service.
    This API enables you to manage and monitor your Search indexes.
  version: '8.0'
servers:
  - url: '{scheme}://{host}:{port}'
    description: The URL scheme, host, and port are as follows.
    variables:
      scheme:
        default: http
        description: |-
          The URL scheme.
          Use `https` for secure access.
        enum:
          - http
          - https
      host:
        default: localhost
        description: The host name or IP address of a node running the Search Service.
      port:
        default: '8094'
        description: |-
          The Search Service REST port.
          Use `18094` for secure access.
        enum:
          - '8094'
          - '18094'
tags:
  - name: Definitions
    x-displayName: Search Index Definitions
    description: Use the following APIs to retrieve Search index definitions, create new Search indexes, or delete an existing Search index.
  - name: Management
    x-displayName: Index Management
    description: Use the following endpoints to manage index controls, such as document ingestion, partition assignment, and queries.
  - name: Monitoring
    x-displayName: Index Monitoring and Debugging
    description: Use the following endpoints to get statistics about Search indexes for monitoring and debugging.
  - name: Querying
    x-displayName: Index Querying
    description: Use the following endpoints to query the contents of a Search index.
paths:
  /api/index:
    get:
      operationId: g-api-index
      summary: Get All Search Index Definitions
      description: Returns all Search index definitions from the bucket where you have read permissions, as a JSON object.
      tags:
        - Definitions
      responses:
        '200':
          description: A JSON object containing all Search index definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIndexesResponse'
              example:
                indexDefs:
                  implVersion: 4.0.0
                  indexDefs:
                    myFirstIndex:
                      name: myFirstIndex
                      params: ''
                      planParams:
                        hierarchyRules: null
                        maxPartitionsPerPIndex: 0
                        nodePlanParams: null
                        numReplicas: 0
                        planFrozen: false
                      sourceName: ''
                      sourceParams: ''
                      sourceType: nil
                      sourceUUID: ''
                      type: fulltext-index
                      uuid: 6cc599ab7a85bf3b
                  uuid: 6cc599ab7a85bf3b
                status: ok
      security:
        - Read: []
  /api/bucket/{BUCKET_NAME}/scope/{SCOPE_NAME}/index:
    get:
      operationId: g-api-scoped-index
      summary: Get All Search Index Definitions (Scoped)
      description: Returns all Search index definitions inside the bucket and scope specified in the endpoint URL as a JSON object.
      tags:
        - Definitions
      parameters:
        - $ref: '#/components/parameters/PathBucket'
        - $ref: '#/components/parameters/PathScope'
      responses:
        '200':
          description: A JSON object containing all Search index definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIndexesResponse'
              example:
                status: ok
                indexDefs:
                  uuid: 23cf9530131858b8
                  indexDefs:
                    travel-sample.inventory.travel-hotel:
                      type: fulltext-index
                      name: travel-hotel
                      uuid: a04a16f178846bc4
                      sourceType: gocbcore
                      sourceName: travel-sample
                      sourceUUID: 8f866261438f8b0d415a437552f3ae99
                      planParams:
                        maxPartitionsPerPIndex: 1024
                        indexPartitions: 1
                      params:
                        doc_config:
                          docid_prefix_delim: ''
                          docid_regexp: ''
                          mode: scope.collection.type_field
                          type_field: type
                        mapping:
                          analysis: {}
                          default_analyzer: standard
                          default_datetime_parser: dateTimeOptional
                          default_field: _all
                          default_mapping:
                            dynamic: true
                            enabled: false
                          default_type: _default
                          docvalues_dynamic: false
                          index_dynamic: true
                          store_dynamic: false
                          type_field: _type
                          types:
                            inventory.hotel:
                              dynamic: false
                              enabled: true
                              properties:
                                reviews:
                                  dynamic: false
                                  enabled: true
                                  properties:
                                    content:
                                      dynamic: false
                                      enabled: true
                                      fields:
                                        - docvalues: true
                                          include_in_all: true
                                          include_term_vectors: true
                                          index: true
                                          name: content
                                          store: true
                                          type: text
                        store:
                          indexType: scorch
                          segmentVersion: 15
                      sourceParams: {}
                    travel-sample.inventory.travel-test:
                      type: fulltext-index
                      name: travel-test
                      uuid: 766ddce5d41a3b41
                      sourceType: gocbcore
                      sourceName: travel-sample
                      sourceUUID: 8f866261438f8b0d415a437552f3ae99
                      planParams:
                        maxPartitionsPerPIndex: 1024
                        indexPartitions: 1
                      params:
                        doc_config:
                          docid_prefix_delim: ''
                          docid_regexp: ''
                          mode: scope.collection.type_field
                          type_field: type
                        mapping:
                          analysis: {}
                          default_analyzer: standard
                          default_datetime_parser: dateTimeOptional
                          default_field: _all
                          default_mapping:
                            dynamic: true
                            enabled: true
                          default_type: _default
                          docvalues_dynamic: false
                          index_dynamic: true
                          store_dynamic: false
                          type_field: _type
                        store:
                          indexType: scorch
                          segmentVersion: 15
                      sourceParams: {}
                  implVersion: 5.7.0
      security:
        - Read: []
  /api/index/{INDEX_NAME}:
    get:
      operationId: g-api-index-name
      summary: Get Index Definition
      description: Returns the definition of the Search index specified in the endpoint URL as a JSON object.
      tags:
        - Definitions
      parameters:
        - $ref: '#/components/parameters/PathIndexFull'
      responses:
        '200':
          description: A JSON object containing the Search index definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIndexResponse'
              example:
                indexDef:
                  name: myFirstIndex
                  params: ''
                  planParams:
                    hierarchyRules: null
                    maxPartitionsPerPIndex: 0
                    nodePlanParams: null
                    numReplicas: 0
                    planFrozen: false
                  sourceName: ''
                  sourceParams: ''
                  source: nil
                  sourceUUID: ''
                  type: fulltext-index
                  uuid: 6cc599ab7a85bf3b
                planPIndexes:
                  - indexName: myFirstIndex
                    indexParams: ''
                    indexType: bleve
                    indexUUID: 6cc599ab7a85bf3b
                    name: myFirstIndex_6cc599ab7a85bf3b_0
                    nodes:
                      78fc2ffac2fd9401:
                        canRead: true
                        canWrite: true
                        priority: 0
                    sourceName: ''
                    sourceParams: ''
                    sourcePartitions: ''
                    sourceType: nil
                    sourceUUID: ''
                    uuid: 64bed6e2edf354c3
                status: ok
                warnings: []
      security:
        - Read: []
    delete:
      operationId: d-api-index-name
      summary: Delete Index Definition
      description: Deletes the Search index definition specified in the endpoint URL.
      tags:
        - Definitions
      parameters:
        - $ref: '#/components/parameters/PathIndexFull'
      responses:
        '200':
          description: The Search Service returns a response that includes the status `ok`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIndexResponse'
              example:
                status: ok
                uuid: 123294e5a4efbe39
        default:
          description: The Search Service returns a non-200 HTTP error code when a request fails.
          content:
            application/json:
              schema:
                type: object
              example:
                error: 'rest_auth: preparePerms, err: index not found'
                request: ''
                status: fail
      security:
        - Write: []
    put:
      operationId: p-api-index-name
      summary: Create or Update an Index Definition
      description: |-
        If the Search index in the endpoint URL does not exist, this endpoint uses a JSON object in the request body to create a new index.
        If the Search index already exists, this endpoint updates the Search index definition.
      tags:
        - Definitions
      parameters:
        - $ref: '#/components/parameters/PathIndexFull'
      requestBody:
        required: true
        description: |-
          The full Search index definition.
          For a detailed list of all parameters for the request body, see [Search Index JSON Properties](../search/search-index-params.html).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexDefinition'
      responses:
        '200':
          description: A JSON object indicating the status of the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutIndexResponse'
              example:
                status: ok
                name: travel-test
                uuid: 565ca041af3baf9d
        default:
          description: The Search Service returns a non-200 HTTP error code when a request fails.
          content:
            application/json:
              schema:
                type: object
              example:
                error: 'rest_create_index: index type is required, indexName: travel-test'
                request: ''
                status: fail
      security:
        - Write: []
