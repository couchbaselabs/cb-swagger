openapi: 3.0.3
info:
  title: Couchbase Search Active Queries REST API
  description: |-
    The Search Active Queries REST API is provided by the Search service.
    This API enables you to get information about active Search queries.
  version: '8.0'
servers:
  - url: '{scheme}://{host}:{port}'
    description: The URL scheme, host, and port are as follows.
    variables:
      scheme:
        default: http
        description: |-
          The URL scheme.
          Use `https` for secure access.
        enum:
          - http
          - https
      host:
        default: localhost
        description: The host name or IP address of a node running the Search Service.
      port:
        default: '8094'
        description: |-
          The Search Service REST port.
          Use `18094` for secure access.
        enum:
          - '8094'
          - '18094'
paths:
  /api/query/index/{indexName}:
    get:
      operationId: api-query-index
      summary: View Active Index Queries
      description: Gets the details of all the active queries for any given Search index in the system.
      parameters:
        - $ref: '#/components/parameters/pathIndexName'
        - $ref: '#/components/parameters/queryLongerThan'
      x-codeSamples:
        - lang: Shell
          source: |-
            curl -XGET -H "Content-Type: application/json" \
            -u $USER:$PASSWORD \
            "http://$HOST:8094/api/query/index/DemoIndex1?longerThan=1ms"
      security:
        - Default: []
      responses:
        '200':
          description: A list of active queries for the specified Search index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveResponse'
              example:
                status: ok
                stats:
                  total: 3
                  successful: 3
                totalActiveQueryCount: 4
                filteredActiveQueries:
                  indexName: DemoIndex1
                  longerThan: 1ms
                  queryCount: 2
                  queryMap:
                    b91d75480470f979f65f04e8f20a1f7b-16:
                      QueryContext:
                        query:
                          query: good restaurants in france
                        size: 10
                        from: 0
                        timeout: 120000
                        index: DemoIndex1
                      executionTime: 1.059754811s
                    f76b2d51397feee28c1e757ed426ef93-2:
                      QueryContext:
                        query:
                          query: mexican food in england
                        size: 10
                        from: 0
                        timeout: 120000
                        index: DemoIndex1
                      executionTime: 1.058247896s
  /api/query:
    get:
      operationId: api-query
      summary: View Active Node Queries
      description: Gets the details of all the active queries in any Search node in a cluster.
      parameters:
        - $ref: '#/components/parameters/queryLongerThan'
      x-codeSamples:
        - lang: Shell
          label: All
          source: |-
            curl -XGET -H "Content-Type: application/json" \
              -u $USER:$PASSWORD \
              "http://$HOST:8094/api/query"
        - lang: Shell
          label: Filtered
          source: |-
            curl -XGET -H "Content-Type: application/json" \
              -u $USER:$PASSWORD \
              "http://$HOST:8094/api/query?longerThan=7s"
      security:
        - Default: []
      responses:
        '200':
          description: A list of all active Search queries across all nodes in the cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveResponse'
              examples:
                all:
                  summary: All active node queries
                  description: All active queries across the Search cluster.
                  value:
                    status: ok
                    stats:
                      total: 3
                      successful: 3
                    totalActiveQueryCount: 4
                    filteredActiveQueries:
                      queryCount: 4
                      queryMap:
                        b91d75480470f979f65f04e8f20a1f7b-17:
                          QueryContext:
                            query:
                              query: good restaurants in france
                            size: 10
                            from: 0
                            timeout: 120000
                            index: DemoIndex1
                          executionTime: 2.144802122s
                        b91d75480470f979f65f04e8f20a1f7b-18:
                          QueryContext:
                            query:
                              query: decent hotel with a pool in italy
                            size: 10
                            from: 0
                            timeout: 120000
                            index: DemoIndex2
                          executionTime: 2.144712787s
                        b91d75480470f979f65f04e8f20a1f7b-19:
                          QueryContext:
                            query:
                              query: germany
                            size: 10
                            from: 0
                            timeout: 120000
                            index: DemoIndex2
                          executionTime: 2.143957727s
                        f76b2d51397feee28c1e757ed426ef93-3:
                          QueryContext:
                            query:
                              query: mexican food in england
                            size: 10
                            from: 0
                            timeout: 120000
                            index: DemoIndex1
                          executionTime: 2.14286421s
                filtered:
                  summary: All active node queries (filtered)
                  description: All queries across the cluster running for longer than 7&nbsp;s.
                  value:
                    status: ok
                    stats:
                      total: 3
                      successful: 3
                    totalActiveQueryCount: 3
                    filteredActiveQueries:
                      longerThan: 7s
                      queryCount: 1
                      queryMap:
                        b91d75480470f979f65f04e8f20a1f7b-21:
                          QueryContext:
                            query:
                              query: decent hotel with a pool in italy
                            size: 10
                            from: 0
                            timeout: 120000
                            index: DemoIndex1
                          executionTime: 10.541956741s
  /api/query/{queryID}/cancel:
    post:
      operationId: api-query-cancel
      summary: Cancel Active Queries
      description: |-
        Allows the user to cancel an active query that's running longer than expected.
        Use the View Active Index Queries API or the View Active Node Queries API to get the parameters `queryID` and `uuid`, which are used to identify and cancel the query.
      parameters:
        - $ref: '#/components/parameters/pathQueryId'
      requestBody:
        description: |-
          The body contains the UUID of the node where the query is running.
          This is optional and allows cancellation of queries on specific nodes.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            example:
              uuid: b91d75480470f979f65f04e8f20a1f7b
      x-codeSamples:
        - lang: Shell
          source: |-
            curl -X POST -H "Content-Type: application/json" -u $USER:$PASSWORD \
              "http://$HOST:8094/api/query/24/cancel" -d \
              '{ "uuid": "b91d75480470f979f65f04e8f20a1f7b" }'
      security:
        - Default: []
      responses:
        '200':
          description: The query was successfully canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
              example:
                status: ok
                msg: query with ID '24' on node 'b91d75480470f979f65f04e8f20a1f7b' was aborted!
  /api/pindex/{pindexName}/query:
    post:
      operationId: api-pindex-query
      summary: Query Index Partition
      description: |-
        Executes a Search query against a specific Search index partition (pindex) by name.

        This endpoint targets a single partition directly, rather than the full index, and is intended for advanced use cases such as those involving index insights.
      parameters:
        - $ref: '#/components/parameters/pathPIndexName'
      requestBody:
        required: true
        description: |-
          A JSON object that defines the settings for your Search query.
          For more information about how to create a Search query JSON object, see [Search Request JSON Properties](../search/search-request-params.html).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      security:
        - Default: []
      responses:
        '200':
          description: |-
            The response object has a status section that must be checked for every request.
            Under nearly all circumstances, the query response will be HTTP 200 even though individual index shards (partitions) may encounter a timeout or return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
  /api/searchHistory:
    get:
      operationId: api-search-history
      summary: View Search History
      description: |-
        Gets the Search requests recently recorded by the Search node that receives the request.
        To get the search history for the whole cluster, send this request to every node running the Search Service.

        The Search Service records Search requests only if the `searchHistoryEnabled` manager option is `true`.
        Search requests made through SQL++ are not recorded.
        In each recorded request, the values of the `vector` and `vector_base64` properties are redacted.
      parameters:
        - $ref: '#/components/parameters/queryHistoryLimit'
        - $ref: '#/components/parameters/queryHistoryOffset'
        - $ref: '#/components/parameters/queryHistoryIndex'
        - $ref: '#/components/parameters/queryHistoryMinDuration'
        - $ref: '#/components/parameters/queryHistoryStatus'
      security:
        - ReadSettings: []
      responses:
        '200':
          description: A list of recorded Search requests, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '500':
          description: The Search Service could not read the search history.
        '503':
          description: The search history is not available on this node.
components:
  parameters:
    pathIndexName:
      name: indexName
      in: path
      required: true
      description: The name of the Search index.
      schema:
        type: string
    pathPIndexName:
      name: pindexName
      in: path
      required: true
      description: The name of the Search index partition (pindex).
      schema:
        type: string
    pathQueryId:
      name: queryID
      in: path
      required: true
      description: |-
        The ID of the active query.
        This ID is used to identify the query that you want to cancel.
      schema:
        type: integer
    queryLongerThan:
      name: longerThan
      in: query
      required: false
      description: |-
        Filters the queries running beyond the given span of time.

        The duration string is a signed sequence of decimal numbers, each with optional fraction and a unit suffix, such as `20s`, `-1.5h` or `2h45m`.
        Valid time units are `ns`, `us` (or `µs`), `ms`, `s`, `m`, `h`.
      schema:
        type: string
        format: duration
    queryHistoryLimit:
      name: limit
      in: query
      required: false
      description: The maximum number of recorded requests to return.
      schema:
        type: integer
        minimum: 1
        maximum: 8000
        default: 100
        x-has-default: true
    queryHistoryOffset:
      name: offset
      in: query
      required: false
      description: The number of recorded requests to skip, for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0
        x-has-default: true
    queryHistoryIndex:
      name: index
      in: query
      required: false
      description: |-
        Returns only requests made against the specified Search index.
        For a scoped index, use the fully qualified name, in the form `BUCKET.SCOPE.INDEX`.
      schema:
        type: string
    queryHistoryMinDuration:
      name: minDuration
      in: query
      required: false
      description: |-
        Returns only requests that took at least the specified time.
        Specify a duration string, such as `750ms` or `1.5s`, or an integer number of milliseconds.
      schema:
        type: string
    queryHistoryStatus:
      name: status
      in: query
      required: false
      description: Returns only requests that succeeded or failed.
      schema:
        type: string
        enum:
          - success
          - failed
  schemas:
    ActiveResponse:
      type: object
      title: Active Response
      properties:
        status:
          type: string
          description: The status of the request.
        stats:
          $ref: '#/components/schemas/ActiveResponseStats'
        totalActiveQueryCount:
          type: integer
          description: The total number of active queries.
        filteredActiveQueries:
          $ref: '#/components/schemas/ActiveResponseFilter'
    ActiveResponseStats:
      type: object
      title: Stats
      description: An object containing request statistics.
      properties:
        total:
          type: integer
          example: 3
          x-has-example: true
        successful:
          type: integer
          example: 3
          x-has-example: true
    ActiveResponseFilter:
      type: object
      title: Filtered Active Queries
      description: An object containing details of the filtered active queries.
      properties:
        indexName:
          type: string
          description: |-
            The name of the Search index.
            Only included if viewing active queries for a specific index.
        longerThan:
          type: string
          format: duration
          description: |-
            The duration used to filter the active queries.
            Only included if the `longerThan` query parameter is used.
        queryCount:
          type: integer
          description: The number of filtered active queries.
        queryMap:
          $ref: '#/components/schemas/ActiveResponseFilterMap'
    ActiveResponseFilterMap:
      type: object
      title: Query Map
      description: Contains 1 or more nested objects, each containing the details of a single active query.
      additionalProperties:
        x-additionalPropertiesName: Node UUID - Query ID
        $ref: '#/components/schemas/ActiveResponseFilterMapItem'
    ActiveResponseFilterMapItem:
      type: object
      title: Query Map Item
      description: |-
        The details of a single active query.
        The name of the property is the UUID of the node on which the query is running, and the ID of the query on that node, separated by a hyphen.
      properties:
        QueryContext:
          $ref: '#/components/schemas/ActiveResponseFilterMapItemContext'
        executionTime:
          type: string
          format: duration
          description: The time taken to execute the query.
    ActiveResponseFilterMapItemContext:
      type: object
      title: Query Context
      description: The query context.
      properties:
        query:
          type: object
          description: |-
            An object containing the Search query.
            For more information, see [Search Request JSON Properties](../search/search-request-params.html).
        size:
          type: integer
          example: 10
          x-has-example: true
        from:
          type: integer
          example: 0
          x-has-example: true
        timeout:
          type: integer
          example: 120000
          x-has-example: true
        index:
          type: string
          description: The name of a Search index.
    CancelRequest:
      type: object
      title: Cancellation Request
      properties:
        uuid:
          type: string
          description: |-
            Represents the active query's coordinator node's UUID, where the query will be canceled.
            This parameter allows the user to cancel a query anywhere in the system by specifying its coordinator node's UUID.
    CancelResponse:
      type: object
      title: Cancellation Response
      properties:
        status:
          type: string
          description: The status of the request.
        msg:
          type: string
          description: The response message, giving details of the node UUID and query ID.
    HistoryResponse:
      type: object
      title: History Response
      properties:
        results:
          type: array
          description: The recorded Search requests, newest first.
          items:
            $ref: '#/components/schemas/HistoryResponseRecord'
        count:
          type: integer
          description: The number of recorded requests in this response.
        total:
          type: integer
          description: The total number of recorded requests on this node that match the filters, before pagination.
    HistoryResponseRecord:
      type: object
      title: History Record
      description: The details of a single recorded Search request.
      properties:
        timestamp:
          type: string
          format: date-time
          description: The time the request started, in UTC.
        index:
          type: string
          description: The name of the Search index.
        request:
          type: string
          description: |-
            The Search request, as a JSON-encoded string.
            For more information, see [Search Request JSON Properties](../search/search-request-params.html).
          example: '{"query":{"field":"description","match":"coffee"},"size":10}'
          x-has-example: true
        tookMs:
          type: integer
          format: int64
          description: The time taken to execute the request, in milliseconds.
        totalHits:
          type: integer
          format: int64
          description: The total number of hits for the request.
        status:
          type: string
          enum:
            - success
            - failed
          description: Whether the request succeeded or failed.
    QueryRequestParams:
      type: object
      title: Score Fusion Parameters
      description: |-
        Parameters for score fusion.
        Only used if `score` is `rrf` or `rsf`.
      properties:
        score_window_size:
          type: integer
          minimum: 1
          description: |-
            The number of results to take from each of the `query` and `knn` result lists before combining them.
            The default is the value of `from` plus `size`.

            The value must be greater than or equal to `size`, and less than or equal to the maximum result window for the Search Service.
            Pagination cannot go beyond this number of results.
        score_rank_constant:
          type: integer
          default: 60
          x-has-default: true
          description: |-
            The rank constant used by Reciprocal Rank Fusion.
            Only used if `score` is `rrf`.
    QueryRequest:
      type: object
      title: Query Request
      properties:
        query:
          type: object
          description: |-
            An object that contains the properties for one of the supported query types.
            For more information, see [Query Object](../search/search-request-params.html#query-object).
        knn:
          type: array
          description: |-
            An array that contains objects that describe a Vector Search query.
            For more information, see [Knn Objects](../search/search-request-params.html#knn-object).
          items:
            type: object
        ctl:
          type: object
          description: |-
            An object that contains properties for query consistency.
            For more information, see [Ctl Object](../search/search-request-params.html#ctl).
          properties:
            bleveMaxTerms:
              type: integer
              description: |-
                The maximum number of term searchers this query can use on each index partition.
                Overrides the `bleveMaxTerms` manager option for this query.
                A value of `0` or less disables the limit for this query.
        size:
          type: integer
          description: Set the total number of results to return for a single page of search results.
        from:
          type: integer
          description: Set an offset value to change where pagination starts for search results.
        highlight:
          type: object
          description: |-
            Contains properties to control search result highlighting.
            For more information, see [Highlight Objects](../search/search-request-params.html#highlight).
        fields:
          type: array
          description: An array of strings to specify each indexed field you want to return in search results.
          items:
            type: string
        facets:
          type: object
          description: |-
            Contains nested objects to define each facet you want to return with search results.
            For more information, see [Facet Objects](../search/search-request-params.html#facet-name).
        explain:
          type: boolean
          description: Whether to create an explanation for a search result's score in search results.
        sort:
          type: array
          description: |-
            Contains an array of strings or JSON objects to set how to sort search results.
            For more information, see [Sort Object](../search/search-request-params.html#sort).
          items: {}
        includeLocations:
          type: boolean
          description: Whether to return the position of each occurrence of a search term inside a document.
        score:
          type: string
          enum:
            - none
            - rrf
            - rsf
          description: |-
            Controls document relevancy scoring in search results.

            - `none`: do not score search results.
            - `rrf`: combine the results of the `query` and `knn` components using Reciprocal Rank Fusion.
            - `rsf`: combine the results of the `query` and `knn` components using Relative Score Fusion.

            If you omit this property, the Search Service scores search results as normal.
        params:
          $ref: '#/components/schemas/QueryRequestParams'
        search_after:
          type: array
          description: |-
            Use to control pagination in search results.
            Contains one value for each entry in `sort`.
            Specify numeric and geo distance values as decimal strings, and date values as RFC 3339 strings.
          items:
            type: string
        search_before:
          type: array
          description: |-
            Use to control pagination in search results.
            Contains one value for each entry in `sort`.
            Specify numeric and geo distance values as decimal strings, and date values as RFC 3339 strings.
          items:
            type: string
        collections:
          type: array
          description: An array of strings that specify the collections where you want to run the query.
          items:
            type: string
    CommonStatus:
      type: string
      title: Status
      description: The status of the operation.
    QueryResponse:
      type: object
      title: Query Response
      properties:
        status:
          $ref: '#/components/schemas/CommonStatus'
        results:
          type: array
          description: The results of the Search query.
          items:
            type: object
  securitySchemes:
    Default:
      type: http
      scheme: basic
    ReadSettings:
      type: http
      scheme: basic
      description: You must have the **Full Admin** or **Cluster Admin** role, with permission to read Search cluster settings (`cluster.settings.fts!read`).
