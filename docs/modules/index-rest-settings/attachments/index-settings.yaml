          type: integer
          format: int32
          x-has-default: true
          default: 1024
          description: Send buffer size.
        indexer.settings.serverless.indexLimit:
          x-alt-title: indexer.&#8203;settings.&#8203;serverless.&#8203;indexLimit
          type: integer
          format: int32
          x-has-default: true
          default: 201
          description: Serverless index limit.
        indexer.settings.sliceBufSize:
          x-alt-title: indexer.&#8203;settings.&#8203;sliceBufSize
          type: integer
          format: int32
          x-has-default: true
          default: 1600
          description: Slice buffer size.
        indexer.settings.smallSnapshotThreshold:
          x-alt-title: indexer.&#8203;settings.&#8203;smallSnapshotThreshold
          type: integer
          format: int32
          x-has-default: true
