        indexer.settings.percentage_memory_quota:
          x-alt-title: indexer.&#8203;settings.&#8203;percentage_memory_quota
          type: integer
          format: int32
          x-has-default: true
          default: 0
          description: Percentage memory quota.
        indexer.settings.persisted_snapshot.fdb.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot.&#8203;fdb.&#8203;interval
