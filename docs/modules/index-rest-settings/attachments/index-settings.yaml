        indexer.settings.persisted_snapshot.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot.interval
          type: integer
          format: int32
          x-has-default: true
          default: 5000
          minimum: 100
          description: |-
            The persisted snapshot interval (ms).
            This must be a multiple of the in-memory snapshot interval.
        indexer.settings.persisted_snapshot.moi.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot.&#8203;moi.&#8203;interval
          type: integer
          format: int32
          x-has-default: true
          default: 600000
          minimum: 100
          description: |-
            For memory-optimized indexes, the persisted snapshot interval (ms).
            This must be a multiple of the in-memory snapshot interval.
        indexer.settings.persisted_snapshot_init_build.fdb.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot_init_build.&#8203;fdb.&#8203;interval
          type: integer
          format: int32
          x-has-default: true
          default: 5000
          description: For standard indexes using Forestdb, the persisted snapshot interval for the initial build (ms).
        indexer.settings.persisted_snapshot_init_build.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot_init_build.&#8203;interval
          type: integer
          format: int32
          x-has-default: true
          default: 5000
          description: The persisted snapshot interval for the initial build (ms).
        indexer.settings.persisted_snapshot_init_build.moi.interval:
          x-alt-title: indexer.&#8203;settings.&#8203;persisted_snapshot_init_build.&#8203;moi.&#8203;interval
          type: integer
          format: int32
          x-has-default: true
          default: 600000
          description: For memory-optimized indexes, the persisted snapshot interval for the initial build (ms).
        indexer.settings.plasma.recovery.max_rollbacks:
          x-alt-title: indexer.&#8203;settings.&#8203;plasma.&#8203;recovery.&#8203;max_rollbacks
          type: integer
          format: int32
          x-has-default: true
          default: 2
          description: For standard indexes using Plasma, the maximum number of committed rollback points.
        indexer.settings.rebalance.blob_storage_bucket:
          x-alt-title: indexer.&#8203;settings.&#8203;rebalance.&#8203;blob_storage_bucket
          type: string
          x-has-default: true
          default: ""
          description: Rebalance blob storage bucket.
        indexer.settings.rebalance.blob_storage_prefix:
          x-alt-title: indexer.&#8203;settings.&#8203;rebalance.&#8203;blob_storage_prefix
          type: string
          x-has-default: true
          default: ""
          description: Rebalance blob storage prefix.
        indexer.settings.rebalance.blob_storage_region:
          x-alt-title: indexer.&#8203;settings.&#8203;rebalance.&#8203;blob_storage_region
          type: string
          x-has-default: true
          default: ""
          description: Rebalance blob storage region.
        indexer.settings.rebalance.blob_storage_scheme:
          x-alt-title: indexer.&#8203;settings.&#8203;rebalance.&#8203;blob_storage_scheme
          type: string
          x-has-default: true
          default: ""
          description: Rebalance blob storage scheme.
        indexer.settings.rebalance.redistribute_indexes:
          x-alt-title: indexer.&#8203;settings.&#8203;rebalance.&#8203;redistribute_indexes
          type: boolean
          x-has-default: true
          default: false
          description: |-
            Whether to redistribute indexes on rebalance.

            * When true, Couchbase Server redistributes indexes when rebalance occurs, in order to optimize performance.

            * When false (the default), such redistribution does not occur.

            For more information, see [Rebalance](/server/8.5/learn/clusters-and-availability/rebalance.html#rebalancing-the-index-service).
        indexer.settings.recovery.max_rollbacks:
          x-alt-title: indexer.&#8203;settings.&#8203;recovery.&#8203;max_rollbacks
          type: integer
          format: int32
          x-has-default: true
          default: 2
          description: The maximum number of committed rollback points.
        indexer.settings.scan_getseqnos_retries:
          x-alt-title: indexer.&#8203;settings.&#8203;scan_getseqnos_retries
          type: integer
          format: int32
          x-has-default: true
          default: 30
          description: Scan get sequence numbers retries.
        indexer.settings.scan_timeout:
          x-alt-title: indexer.&#8203;settings.&#8203;scan_timeout
          type: integer
          format: int32
          x-has-default: true
          default: 120000
          description: |-
            The default timeout for the indexer, in milliseconds.
            This is distinct from the Query Service timeout.
            The Index Service has its own timeout because index scans consume resources such as memory and CPU while holding snapshots and performing range scan.

            An index scan may time out if the Index Service timeout is lower than the Query Service timeout.
        indexer.settings.send_buffer_size:
