apply plugin: 'org.openapi.generator'

tasks.register('getExamples') {
  doLast {
    ant.property(name: "srcUrl",
                value: "https://raw.githubusercontent.com/couchbase/query/refs/heads/trinity/docs/spec/functions/examples")
    ant.echo("Fetching from ${ant.srcUrl}")
    ant.get(dest: "examples") {
      ant.url(url: "${ant.srcUrl}/get_collection_all.json")
      ant.url(url: "${ant.srcUrl}/get_collection_scope.json")
      ant.url(url: "${ant.srcUrl}/get_library_global.json")
      ant.url(url: "${ant.srcUrl}/get_library_scope.json")
    }
  }
}

openApiGenerate {
    generatorName = "asciidoc"
    remoteInputSpec = "https://raw.githubusercontent.com/couchbase/query/refs/heads/trinity/docs/spec/functions/functions.yaml"
    outputDir = "${rootDir}/docs/modules/n1ql-rest-functions/pages"
    templateDir = "${rootDir}/templates"
    gitRepoId = "query"
    gitUserId = "couchbase"
    additionalProperties = [
            specDir: "${rootDir}/docs/modules/n1ql-rest-functions/partials/",
            snippetDir: "${rootDir}/docs/modules/n1ql-rest-functions/partials/paths/",
            headerAttributes: "true",
            useIntroduction: "true",
            useTableTitles: "true",
            skipExamples: "true",
            legacyDiscriminatorBehavior: "true"
    ]
    globalProperties = [
            generateAliasAsModel: "true"
    ]
    generateAliasAsModel = true
}

tasks.openApiGenerate.dependsOn(getExamples)