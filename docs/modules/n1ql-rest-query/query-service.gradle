plugins {
  id "com.github.node-gradle.node" version "7.1.0"
}

plugins {
    id("io.datapith.jayOverlay").version("0.1.11")
}

apply plugin: 'org.openapi.generator'

task bundleSpec(type: NpxTask) {
  command = '@redocly/cli'
  args = [
    'bundle',
    'https://raw.githubusercontent.com/couchbase/query/refs/heads/morpheus/docs/spec/service/service.yaml',
    '-o', 'build/bundle/service.yaml']
}

jayOverlay {
    targetFile.set("${projectDir}/build/bundle/service.yaml")
    overlayFile.set("${projectDir}/attachments/_overlay.json")
    outputDir.set("${projectDir}/build/overlay")
}

openApiGenerate {
    generatorName = "asciidoc"
    inputSpec = file("build/overlay/service.yaml").getAbsolutePath().toString()
    outputDir = "${rootDir}/docs/modules/n1ql-rest-query/pages"
    templateDir = "${rootDir}/templates"
    gitRepoId = "query"
    gitUserId = "couchbase"
    additionalProperties = [
            specDir: "${rootDir}/docs/modules/n1ql-rest-query/partials/",
            snippetDir: "${rootDir}/docs/modules/n1ql-rest-query/partials/paths/",
            headerAttributes: "true",
            useIntroduction: "true",
            useTableTitles: "true",
            skipExamples: "true",
            legacyDiscriminatorBehavior: "true"
    ]
    globalProperties = [
            generateAliasAsModel: "true"
    ]
    generateAliasAsModel = true
    engine = "handlebars"
}

tasks.applyOverlay.dependsOn(bundleSpec)
tasks.openApiGenerate.dependsOn(applyOverlay)