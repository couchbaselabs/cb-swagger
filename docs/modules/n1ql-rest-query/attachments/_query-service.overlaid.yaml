        statement:
          type: "string"
          x-desc-name: "statement"
          description: "Required if `prepared` or `natural` not provided.\n\nAny valid\
            \ SQL++ statement for a POST request, or a read-only SQL++ statement (SELECT,\
            \ EXPLAIN) for a GET request.\n\nIf both `prepared` and `statement` are\
            \ present and non-empty, an error is returned.\n\n---\n\nWhen specifying\
            \ the request parameters as form data, the statement may not contain an\
            \ unescaped semicolon (`;`).\nIf it does, the Query Service responds with\
            \ error 1040.\nTo avoid this, either URL-encode the semicolon as `%3B`,\
            \ or just omit the semicolon if possible.\n\nThis restriction does not\
            \ apply when specifying the request parameters in JSON format."
          x-has-example: true
          example: "SELECT * FROM `travel-sample`.inventory.hotel LIMIT 1"
        timeout:
          type: "string"
          format: "duration"
          x-desc-name: "timeout_req"
          description: "Maximum time to spend on the request before timing out (s).\n\
            \nThe value for this parameter is a string.\nIts format includes an amount\
            \ and an optional unit: for example, `10ms` (10 milliseconds) or `0.5s`\
            \ (half a second).\nIf not specified, the default unit is `s` (seconds).\n\
            Valid units are:\n\n* `ns` (nanoseconds)\n* `us` (microseconds)\n* `ms`\
            \ (milliseconds)\n* `s` (seconds)\n* `m` (minutes)\n* `h` (hours)\n\n\
            Specify a duration of `0` or a negative duration to disable.\nWhen disabled,\
            \ no timeout is applied and the request runs for however long it takes.\n\
            \nIf `tximplicit` or `txid` is set, this parameter is ignored.\nThe request\
            \ inherits the remaining time of the transaction as timeout."
          x-desc-more: "The [node-level][timeout-srv] `timeout` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\nHowever, if the node-level\
            \ setting is greater than 0, the timeout for the query is limited to the\
            \ node-level setting.\n\nIn addition, the [cluster-level][queryTimeout]\
            \ `queryTimeout` setting specifies the default for this parameter for\
            \ the whole cluster.\nWhen you change the cluster-level setting, the node-level\
            \ setting is overwritten for all nodes in the cluster.\n\n[timeout-srv]:\
            \ ../n1ql-rest-admin/index.html#timeout-srv\n[queryTimeout]: ../n1ql-rest-settings/index.html#queryTimeout"
          x-desc-refs: "[timeout-srv]: #timeout-srv\n[queryTimeout]: #queryTimeout"
          x-has-example: true
          example: "30m"
        txdata:
          type: "object"
          x-desc-name: "txdata"
          description: "Transaction data.\nFor internal use only."
        txid:
          type: "string"
          format: "UUID"
          x-desc-name: "txid"
          description: "Required for statements within a transaction.\n\nTransaction\
            \ ID.\nSpecifies the transaction to which a statement belongs.\nFor use\
            \ with DML statements within a transaction, rollbacks, and commits.\n\n\
            The transaction ID should be the same as the transaction ID generated\
            \ by the `BEGIN TRANSACTION` statement.\nThe transaction must be active\
            \ and non-expired."
          x-has-example: true
          example: "d81d9b4a-b758-4f98-b007-87ba262d3a51"
        tximplicit:
          type: "boolean"
          x-desc-name: "tximplicit"
          description: "Specifies that a DML statement is a singleton transaction.\n\
            \nWhen this parameter is true, the Query Service starts a transaction\
            \ and executes the statement.\nIf execution is successful, the Query Service\
            \ commits the transaction; otherwise the transaction is rolled back.\n\
            \nThe statement may not be part of an ongoing transaction.\nIf the `txid`\
            \ request-level parameter is set, the `tximplicit` parameter is ignored."
          x-has-default: true
          x-has-example: true
          default: false
          example: true
        txstmtnum:
          type: "integer"
          format: "int32"
          x-desc-name: "txstmtnum"
          description: "Transaction statement number.\nThe transaction statement number\
            \ must be a positive integer, and must be higher than any previous transaction\
            \ statement numbers in the transaction.\nIf the transaction statement\
            \ number is lower than the transaction statement number for any previous\
            \ statement, an error is generated."
          x-has-example: true
          example: 10
        txtimeout:
          type: "string"
          format: "duration"
          x-desc-name: "txtimeout_req"
          description: "Maximum time to spend on a transaction before timing out.\n\
            Only applies to `BEGIN TRANSACTION` statements, or DML statements for\
            \ which `tximplicit` is set.\nFor other statements, it's ignored.\n\n\
            Within a transaction, the request-level `timeout` parameter is ignored.\n\
            The transaction timeout clock starts when the `BEGIN WORK` statement is\
            \ successful.\nOnce the transaction timeout is reached, no statement is\
            \ allowed to continue in the transaction.\n\nThe value for this parameter\
            \ is a string.\nIts format includes an amount and a mandatory unit, e.g.\
            \ `10ms` (10 milliseconds) or `0.5s` (half a second).\nValid units are:\n\
            \n* `ns` (nanoseconds)\n* `us` (microseconds)\n* `ms` (milliseconds)\n\
            * `s` (seconds)\n* `m` (minutes)\n* `h` (hours)\n\nSpecify a duration\
            \ of `0` to disable.\nWhen disabled, the request-level timeout is set\
            \ to the default.\n\nThe default is `\"15s\"` for cbq files or scripts,\
            \ `\"2m\"` for interactive cbq sessions or redirected input."
          x-desc-more: "The [node-level][txtimeout-srv] `txtimeout` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\nHowever, if the node-level\
            \ setting is greater than 0, the transaction timeout for the query is\
            \ limited to the node-level setting.\n\nIn addition, the [cluster-level][queryTxTimeout]\
            \ `queryTxTimeout` setting specifies the default for this parameter for\
            \ the whole cluster.\nWhen you change the cluster-level setting, the node-level\
            \ setting is overwritten for all nodes in the cluster.\n\n[txtimeout-srv]:\
            \ ../n1ql-rest-admin/index.html#txtimeout-srv\n[queryTxTimeout]: ../n1ql-rest-settings/index.html#queryTxTimeout"
          x-desc-refs: "[txtimeout-srv]: #txtimeout-srv\n[queryTxTimeout]: #queryTxTimeout"
          x-has-example: true
          example: "30m"
        use_cbo:
          type: "boolean"
          x-desc-name: "use_cbo_req"
          description: "Specifies whether the cost-based optimizer is enabled."
          x-desc-more: "The [node-level][use-cbo-srv] `use-cbo` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\n\nIn addition, the [cluster-level][queryUseCBO]\
            \ `queryUseCBO` setting specifies the default for this parameter for the\
            \ whole cluster.\nWhen you change the cluster-level setting, the node-level\
            \ setting is overwritten for all nodes in the cluster.\n\n[use-cbo-srv]:\
            \ ../n1ql-rest-admin/index.html#use-cbo-srv\n[queryUseCBO]: ../n1ql-rest-settings/index.html#queryUseCBO"
          x-desc-refs: "[use-cbo-srv]: #use-cbo-srv\n[queryUseCBO]: #queryUseCBO"
          x-has-example: true
          example: true
        use_fts:
          type: "boolean"
          x-desc-name: "use_fts"
          description: "Specifies that the query should use a Search index.\n\nIf\
            \ the query contains a `USING FTS` hint, that takes priority over this\
            \ parameter.\n\nIf the query does not contain a `USING FTS` hint, and\
            \ this parameter is set to true, all Search indexes are considered for\
            \ the query.\nIf a qualified Search index is available, it's selected\
            \ for the query.\nIf none of the available Search indexes are qualified,\
            \ the available GSI indexes are considered instead.\n\nFor more information,\
            \ see [Flex Indexes][flex-indexes].\n\n[flex-indexes]: ../n1ql/n1ql-language-reference/flex-indexes.html"
          x-desc-refs: "[flex-indexes]: ../n1ql-language-reference/flex-indexes.html"
          x-has-default: true
          x-has-example: true
          default: false
          example: true
        use_replica:
          type: "string"
          enum:
          - "off"
          - "on"
          - "unset"
          x-has-default: true
          x-has-example: true
          default: "unset"
          example: "on"
          x-desc-name: "use_replica_req"
          description: "Specifies whether a query can fetch data from a replica vBucket\
            \ if active vBuckets are inaccessible.\nThe possible values are:\n\n*\
            \ `off` &mdash; read from replica is disabled for this request.\n\n* `on`\
            \ &mdash; read from replica is enabled for this request, unless it has\
            \ been disabled for all requests at node level.\n\n* `unset` &mdash; read\
            \ from replica is specified by the node-level setting.\nIf the node-level\
            \ setting is also `unset`, read from replica is disabled for this request.\n\
            \nDo not enable read from replica when you require consistent results.\n\
            Only SELECT queries that are not within a transaction can read from replica.\n\
            \nReading from replica is only possible if the cluster uses Couchbase\
            \ Server 7.6.0 or later.\n\nYou cannot currently start KV range scans\
            \ on a replica vBucket.\nIf a query uses sequential scan and a data node\
            \ becomes unavailable, the query might return an error, even if read from\
            \ replica is enabled for the request."
          x-desc-more: "The [node-level][use-replica-srv] `use-replica` setting specifies\
            \ the default for this property for a single node.\nThe request-level\
            \ parameter usually overrides the node-level setting.\nHowever, when the\
            \ node-level setting is `off`, the request-level parameter cannot enable\
            \ the property.\n\nIn addition, the [cluster-level][queryUseReplica] `queryUseReplica`\
            \ setting specifies the default for this property for the whole cluster.\n\
            When you change the cluster-level setting, the node-level setting is overwritten\
            \ for all nodes in the cluster.\n\n[use-replica-srv]: ../n1ql-rest-admin/index.html#use-replica-srv\n\
            [queryUseReplica]: ../n1ql-rest-settings/index.html#queryUseReplica"
          x-desc-refs: "[use-replica-srv]: #use-replica-srv\n[queryUseReplica]: #queryUseReplica"
      additionalProperties:
        x-desc-name: "identifier"
        x-additionalPropertiesName: "$identifier"
        description: "Supplies the value for a named parameter in the statement.\n\
          Applicable if the statement or prepared statement contains 1 or more named\
          \ parameters.\n\nThe name of this property consists of two parts:\n\n1.\
          \ The `$` character or the `@` character.\n2. An identifier that specifies\
          \ the name of the parameter.\n    This starts with an optional underscore\
          \ (`_`), followed by an alpha character, followed by one or more alphanumeric\
          \ characters, and ends with an optional underscore (`_`).\n\nIf the named\
          \ parameter contains sensitive information, start and end the name of the\
          \ parameter (after the initial `$` or `@`) with an underscore (`_`).\nThis\
          \ masks the parameter value in the active requests catalog, the completed\
          \ requests catalog, the response `controls` section, the cbq shell file\
          \ history, and the query logs.\nWhen masked, a string parameter value is\
          \ replaced by asterisks (`*`); other parameter values are replaced by `null`.\n\
          Parameter masking is available in clusters running Couchbase Server 7.6.8\
          \ and later.\n\nThe value of the named parameter can be any JSON value.\n\
          \nFor more information, see [Named Parameters and Positional Parameters][section_srh_tlm_n1b].\n\
          \n[section_srh_tlm_n1b]: ../n1ql/n1ql-manage/query-settings.html#section_srh_tlm_n1b"
        x-desc-refs: "[section_srh_tlm_n1b]: #section_srh_tlm_n1b"
        example: "LAX"
        x-has-example: true
    RequestScanVector:
      x-desc-name: "scan_vector"
      x-additionalPropertiesName: "keyspace"
      title: "Scan Vector"
      description: "Specifies the lower bound vector timestamp for a single keyspace\
        \ when using `at_plus` scan consistency.\n\nThe scan vector may be full or\
        \ sparse.\n\n* A full scan vector is an array of [`value`, `guard`] entries,\
        \ giving an entry for every vBucket in the system.\n\n* A sparse scan vector\
        \ is an object mapping [`value`, `guard`] entries to specific vBuckets.\n\
        The name of each property in the object is a vBucket number (a string)."
      example:
        "5":
        - 5409393
        - "VB5ID"
        "19":
        - 47574574
        - "VB19ID"
      oneOf:
      - $ref: "#/components/schemas/RequestScanVectorFull"
      - $ref: "#/components/schemas/RequestScanVectorSparse"
    RequestScanVectors:
      x-desc-name: "scan_vectors"
      title: "Scan Vectors"
      type: "object"
      description: "Specifies the lower bound vector timestamps for multiple keyspaces\
        \ when using `at_plus` scan consistency.\n\nAn object mapping scan vectors\
        \ to keyspaces.\nThe name of each property in the object is a keyspace name."
      additionalProperties:
        $ref: "#/components/schemas/RequestScanVector"
    RequestScanVectorFull:
      type: "array"
      title: "Full Scan Vector"
      description: "An array of [`value`, `guard`] entries, giving an entry for every\
        \ vBucket in the system."
      items:
        $ref: "#/components/schemas/RequestScanVectorValueGuard"
    RequestScanVectorSparse:
      type: "object"
      title: "Sparse Scan Vector"
      description: "An object providing entries for specific vBuckets, mapping a vBucket\
        \ number (a string) to each [`value`, `guard`] entry."
      additionalProperties:
        $ref: "#/components/schemas/RequestScanVectorValueGuard"
    RequestScanVectorValueGuard:
      x-additionalPropertiesName: "vBucket"
      type: "array"
      title: "Value-Guard Entry"
      description: "A nested array containing two elements, the `value` and the `guard`."
      minItems: 2
      maxItems: 2
      items:
        description: "The first item is the `value`.\nThis is a vBucket's sequence\
          \ number (a JSON number).\n\nThe second item is the `guard`.\nThis is a\
          \ vBucket's UUID (a string)."
        nullable: false
    Response:
      type: "object"
      title: "Response Body"
      description: "The response body has the following structure."
      properties:
        requestID:
          type: "string"
          format: "UUID"
          description: "A unique identifier for the response."
        clientContextID:
          type: "string"
          description: "The client context ID of the request, if one was supplied\
            \ &mdash; see `client_context_id` in the request parameters."
        generated_statement:
          type: "string"
          x-desc-status: "Couchbase Server 8.0"
          description: "The generated statement, if the request was a natural language\
            \ prompt."
          x-has-example: true
          example: "SELECT country, COUNT(*) AS `airline_count` FROM `travel-sample`.`inventory`.`airline`\
            \ AS `a` GROUP BY country"
        signature:
          type: "object"
          description: "The schema of the results.\nPresent only when the query completes\
            \ successfully."
          x-has-example: true
          example:
            id: "json"
        results:
          type: "array"
          items: {}
          description: "An array of all the objects returned by the query.\nAn object\
            \ can be any JSON value."
        status:
          type: "string"
          description: "The status of the request."
          enum:
          - "success"
          - "running"
          - "errors"
          - "completed"
          - "stopped"
          - "timeout"
          - "fatal"
        errors:
          type: "array"
          description: "An array of 0 or more error objects.\nIf an error occurred\
            \ during processing of the request, it will be represented by an error\
            \ object in this list."
          items:
            $ref: "#/components/schemas/ResponseConditions"
        warnings:
          type: "array"
          description: "An array of 0 or more warning objects.\nIf a warning occurred\
            \ during processing of the request, it's represented by a warning object\
            \ in this list."
          items:
            $ref: "#/components/schemas/ResponseConditions"
        metrics:
          $ref: "#/components/schemas/ResponseMetrics"
        controls:
          $ref: "#/components/schemas/ResponseControls"
        profile:
          $ref: "#/components/schemas/ResponseProfile"
    ResponseConditions:
      type: "object"
      title: "Conditions"
      description: "Errors and warnings have the following format."
      required:
      - "code"
      - "msg"
      properties:
        code:
          type: "integer"
          description: "A unique number that identifies the error or warning.\nThe\
            \ code ranges are partitioned by component.\nThe codes can also include\
            \ parts that indicate severity and transience.\nThis property is always\
            \ present in every condition returned in the Query REST API or captured\
            \ in a log."
        msg:
          type: "string"
          description: "A message describing the error or warning in detail.\nThis\
            \ property is always present in every condition returned in the Query\
            \ REST API or captured in a log."
        name:
          type: "string"
          description: "Unique name that has a 1:1 mapping to the code.\nUniquely\
            \ identifies the condition.\nThis property is helpful for pattern matching\
            \ and can have meaning, making it more memorable than the code.\nThe name\
            \ should be fully qualified."
          x-has-example: true
          example: "indexing.scan.io_failure"
          x-example: "query.execute.index_not_found"
        sev:
          type: "integer"
          description: "One of the following SQL++ severity levels, listed in order\
            \ of severity:\n\n 1. Severe\n 2. Error\n 3. Warn\n 4. Info"
        temp:
          type: "boolean"
          description: "Indicates if the condition is transient &mdash; for example,\
            \ the queue is full.\nIf the value is `false`, it tells clients and users\
            \ that a retry without modification produces the same condition."
    ResponseMetrics:
      type: "object"
      title: "Metrics"
      description: "An object containing metrics about the request."
      required:
      - "elapsedTime"
      - "executionTime"
      - "resultCount"
      - "resultSize"
      properties:
        elapsedTime:
          type: "string"
          format: "duration"
          description: "The total time taken for the request &mdash; in other words,\
            \ the time from when the request was received until the results were returned."
        executionTime:
          type: "string"
          format: "duration"
          description: "The time taken for the execution of the request &mdash; in\
            \ other words, the time from when query execution started until the results\
            \ were returned."
        resultCount:
          type: "integer"
          format: "unsigned"
          description: "The total number of objects in the results."
        resultSize:
          type: "integer"
          format: "unsigned"
          description: "The total number of bytes in the results."
        naturalLanguageProcessingTime:
          type: "string"
          format: "duration"
          description: "The total time spent processing a natural language request.\n\
            The cumulation of authentication, collecting schema, and time waiting\
            \ for the response from the LLM, or wait time for the natural language\
            \ request to be serviced."
        mutationCount:
          type: "integer"
          description: "The number of mutations that were made during the request."
          format: "unsigned"
        sortCount:
          type: "integer"
          format: "unsigned"
          description: "The number of objects that were sorted.\nPresent only if the\
            \ request includes `ORDER BY`.\n\nIf a query includes ORDER BY, LIMIT,\
            \ or OFFSET clauses, an application can use the `sortCount` value to give\
            \ the overall number of results in a message such as `\"page 1 of N\"\
            `."
        usedMemory:
          type: "integer"
          format: "unsigned"
          description: "The amount of document memory used to execute the request.\n\
            This property is only returned if a memory quota was set for the query."
        errorCount:
          type: "integer"
          format: "unsigned"
          description: "The number of errors that occurred during the request."
        warningCount:
          type: "integer"
          format: "unsigned"
          description: "The number of warnings that occurred during the request."
        sessionMemory:
          type: "integer"
          format: "bytes"
          description: "The memory session size for the request, in bytes.\n\nEach\
            \ request has a dedicated memory session.\nWhen a query requires a document\
            \ or value, memory is allocated from this session based on the size of\
            \ the document or value.\nOnce the document or value is processed, the\
            \ allocated memory is returned back to the session, enabling it to be\
            \ reused by the request.\n\nThis metric is available only when `node-quota`\
            \ and `node-quota-val-percent` are configured for the node."
    ResponseControls:
      type: "object"
      title: "Controls"
      description: "An object containing runtime information provided along with the\
        \ request.\nPresent only if `controls` was set to true in the request parameters."
      properties:
        scan_consistency:
          type: "string"
          description: "The value of the query setting Scan Consistency used for the\
            \ query."
        use_cbo:
          type: "boolean"
          description: "Whether the cost-based optimizer was enabled for the query."
        memoryQuota:
          type: "integer"
          format: "unsigned"
          description: "The memory quota for the request, in MB.\nThis property is\
            \ only returned if a memory quota was set for the query."
        stmtType:
          type: "string"
          description: "The type of query statement."
          x-has-example: true
          example: "SELECT"
    ResponseProfile:
      type: "object"
      title: "Profile"
      description: "An object containing monitoring and profiling information about\
        \ the request.\nPresent only if `profile` was set to `\"phases\"` or `\"timings\"\
        ` in the request parameters."
      required:
      - "requestTime"
      - "servicingHost"
      - "phaseCounts"
      - "phaseOperators"
      - "phaseTimes"
      properties:
        requestTime:
          type: "string"
          format: "date-time"
          description: "Timestamp when the query was received."
        servicingHost:
          type: "string"
          description: "IP address and port number of the node where the query was\
            \ executed."
        phaseCounts:
          type: "object"
          description: "Count of documents processed at selective phases involved\
            \ in the query execution, such as authorize, index scan, fetch, parse,\
            \ plan, run, etc."
          x-has-example: true
          example:
            fetch: 16
            indexScan: 187
        phaseOperators:
          type: "object"
          description: "Indicates the numbers of each kind of query operator involved\
            \ in different phases of the query processing.\n\nFor instance, a non-covering\
            \ index path might involve one index scan and one fetch operator.\nA join\
            \ would probably involve two or more fetches, one per keyspace.\nA union\
            \ select would have twice as many operator counts, one per each branch\
            \ of the union.\n\nThis is in essence the count of all the operators in\
            \ the `executionTimings` object."
          x-has-example: true
          example:
            authorize: 1
            fetch: 1
            indexScan: 2
        phaseTimes:
          type: "object"
          description: "Cumulative execution times for various phases involved in\
            \ the query execution, such as authorize, index scan, fetch, parse, plan,\
            \ run, etc."
          x-has-example: true
          example:
            authorize: "823.631µs"
            fetch: "656.873µs"
            indexScan: "29.146543ms"
            instantiate: "236.221µs"
            parse: "826.382µs"
            plan: "11.831101ms"
            run: "16.892181ms"
        executionTimings:
          $ref: "#/components/schemas/ResponseProfileTiming"
        ioTime:
          type: "string"
          format: "duration"
          description: "The total sum of [servTime](#serv_time) across all operators.\n"
          x-has-example: true
          example: "752.858519ms"
        waitTime:
          type: "string"
          format: "duration"
          description: "The total sum of [kernTime](#kern_time) across all operators.\n"
          x-has-example: true
          example: "1.201307s"
        cpuTime:
          type: "string"
          format: "duration"
          description: "The total sum of [execTime](#exec_time) across all operators.\n"
          x-has-example: true
          example: "90.734075ms"
        "~analysis":
          type: "array"
          items:
            type: "string"
          description: "An array of text phrases that provide a basic analysis of\
            \ the request execution.\nThese phrases highlight notable aspects of the\
            \ execution, such as high document counts during primary scans or warnings\
            \ related to memory and resource usages.\n"
          x-has-example: true
          example:
          - "High IO time"
          - "High primary scan document count"
    ResponseProfileTiming:
      type: "object"
      title: "Execution Timings"
      description: "Present only if `profile` was set to `\"timings\"` in the request\
        \ parameters.\n\nThe execution details for various phases involved in the\
        \ query execution, such as kernel and service execution times, number of documents\
        \ processed at each query operator in each phase, and number of phase switches."
      required:
      - "#operator"
      - "#stats"
      properties:
        '#operator':
          type: "string"
          description: "Name of the operator."
          x-has-example: true
          example: "Fetch"
        '#stats':
          $ref: "#/components/schemas/ResponseProfileTimingStats"
        "~child":
          type: "object"
          description: "Further nested operators, each with their own execution timings."
    ResponseProfileTimingStats:
      type: "object"
      title: "Statistics"
      description: "Statistics collected for the operator."
      properties:
        '#itemsIn':
          type: "integer"
          format: "int32"
          description: "Number of input documents to the operator."
          x-has-example: true
          example: 187
        '#itemsOut':
          type: "integer"
          format: "int32"
          description: "Number of output documents after the operator processing."
          x-has-example: true
          example: 16
        '#phaseSwitches':
          type: "integer"
          format: "int32"
          description: "Number of switches between executing, waiting for services,\
            \ or waiting for the goroutine scheduler."
          x-has-example: true
          example: 413
        execTime:
          type: "string"
          format: "duration"
          x-desc-name: "exec_time"
          description: "Time spent executing the operator code inside SQL++ query\
            \ engine."
          x-has-example: true
          example: "128.434µs"
        kernTime:
          type: "string"
          format: "duration"
          x-desc-name: "kern_time"
          description: "Time spent waiting to be scheduled for CPU time."
          x-has-example: true
          example: "15.027879ms"
        servTime:
          type: "string"
          format: "duration"
          x-desc-name: "serv_time"
          description: "Time spent waiting for another service, such as index or data.\n\
            \nFor index scan, it's time spent waiting for GSI/indexer.\n\nFor fetch,\
            \ it's time spent waiting on the KV store."
          x-has-example: true
          example: "1.590934ms"
  securitySchemes:
    Header:
      type: "http"
      scheme: "basic"
      description: "Specify a user name and password via HTTP headers.\nThis method\
        \ can only be used to provide a single credential."
    Parameter:
      type: "apiKey"
      name: "creds"
      in: "query"
      description: "Specify user names and passwords via the `creds` request parameter.\n\
