        preserve_expiry:
          type: "boolean"
          x-desc-name: "preserve_expiry"
          description: "Specifies whether documents should keep their current expiration\
            \ setting when modified by a DML statement.\n\nIf `true`, documents will\
            \ keep any existing expiration setting when modified by a DML statement.\n\
            If the DML statement explicitly specifies the document expiration, the\
            \ statement overrides this parameter, and the expiration is changed.\n\
            \nIf `false`, document expiration is set to 0 when modified by a DML statement,\
            \ unless the DML statement explicitly specifies the document expiration.\n\
            \nNot supported for statements in a transaction."
          x-has-default: true
          x-has-example: true
          default: false
          example: true
        pretty:
          type: "boolean"
          x-desc-name: "pretty_req"
          description: "Specifies the query results returned in pretty format."
          x-desc-more: "The [node-level][pretty-srv] `pretty` setting specifies the\
            \ default for this parameter for a single node.\nThe request-level parameter\
            \ overrides the node-level setting.\n\n[pretty-srv]: ../n1ql-rest-admin/index.html#pretty-srv"
          x-desc-refs: "[pretty-srv]: #pretty-srv"
          x-has-example: true
          example: false
        profile:
          type: "string"
          x-desc-name: "profile_req"
          description: "Specifies if there should be a profile section returned with\
            \ the request results.\nThe valid values are:\n\n* `off` &mdash; No profiling\
            \ information is added to the query response.\n\n* `phases` &mdash;\n\
            The query response includes a profile section with stats and details about\
            \ various phases of the query plan and execution.\nThree phase times will\
            \ be included in the `system:active_requests` and `system:completed_requests`\
            \ monitoring keyspaces.\n\n* `timings` &mdash;\nBesides the phase times,\
            \ the profile section of the query response document will include a full\
            \ query plan with timing and information about the number of processed\
            \ documents at each phase.\nThis information will be included in the `system:active_requests`\
            \ and `system:completed_requests` keyspaces.\n\nIf `profile` is not set\
            \ as one of the above values, then the profile setting does not change."
          x-desc-more: "The [node-level][profile-srv] `profile` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\n\n[profile-srv]: ../n1ql-rest-admin/index.html#profile-srv"
          x-desc-refs: "[profile-srv]: #profile-srv"
          enum:
