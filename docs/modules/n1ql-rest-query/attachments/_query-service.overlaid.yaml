openapi: "3.0.3"
info:
  title: "Query Service REST API"
  version: "8.0"
  description: "The Query Service REST API is provided by the Query Service.\nThis\
    \ API enables you to run SQL++ queries and set request-level parameters."
servers:
- url: "{scheme}://{host}:{port}"
  description: "The URL scheme, host, and port are as follows."
  variables:
    scheme:
      default: "http"
      description: "The URL scheme.\nUse `https` for secure access."
      enum:
      - "http"
      - "https"
    host:
      default: "localhost"
      description: "The host name or IP address of a node running the Query Service."
    port:
      default: "8093"
      description: "The Query Service REST port.\nUse `18093` for secure access."
      enum:
      - "8093"
      - "18093"
paths:
  /query/service:
    post:
      operationId: "post_service"
      summary: "Query Service"
      description: "Enables you to execute a SQL++ statement.\nThis method allows\
        \ you to run SELECT queries and other DML statements, and specify query parameters."
      requestBody:
        required: true
        description: "An object specifying one or more query parameters."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
            examples:
              named:
                summary: "Named Parameters"
                description: "This request uses named parameters."
                value:
                  statement: "SELECT airline FROM `travel-sample`.inventory.route\
                    \ WHERE sourceairport = $aval AND distance > $dval"
                  $aval: "LAX"
                  $dval: 13000
              numbered:
                summary: "Numbered Positional Parameters"
                description: "This request uses numbered positional parameters."
                value:
                  statement: "SELECT airline FROM `travel-sample`.inventory.route\
                    \ WHERE sourceairport = $1 AND distance > $2"
                  args:
                  - "LAX"
                  - 13000
              positional:
                summary: "Unnumbered Positional Parameters"
                description: "This request uses unnumbered positional parameters."
                value:
                  statement: "SELECT airline FROM `travel-sample`.inventory.route\
                    \ WHERE sourceairport = ? AND distance > ?"
                  args:
                  - "LAX"
                  - 13000
              wildcard:
                summary: "Wildcards"
                description: "This request uses a wildcard.\n\nThe `%` symbol is the\
                  \ escape character in URIs, so when using `%` as a wildcard in a\
                  \ query, you may need to escape it by replacing it with its corresponding\
                  \ ASCII code `%25`."
                value:
                  statement: "SELECT meta().id FROM `travel-sample`.inventory.hotel\
                    \ WHERE meta().id LIKE $pattern"
                  $pattern: "hotel_1002%"
              atplus:
                summary: "Bounded Consistency with a Scan Vector"
                description: "This request uses `at_plus` consistency with a sparse\
                  \ scan vector."
                value:
                  statement: "SELECT name FROM `travel-sample`.inventory.hotel LIMIT\
                    \ 1;"
                  scan_consistency: "at_plus"
                  scan_vector:
                    "5":
                    - 5409393
                    - "VB5ID"
                    "19":
                    - 47574574
                    - "VB19ID"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Request"
      security:
      - Header: []
      - Parameter: []
      x-codeSamples:
      - lang: "Shell"
        label: "Form Data"
        description: "Because it's sent as form data, the statement in this example\
          \ avoids using a semicolon."
        source: "curl -v $BASEPATH/query/service \\\n     -d 'statement=SELECT name\
          \ FROM `travel-sample`.inventory.hotel LIMIT 1' \\\n     -u $USER:$PASSWORD"
      - lang: "Shell"
        label: "JSON"
        description: "Because it's sent as a JSON object, the statement in this example\
          \ can contain a semicolon."
        source: "curl -v $BASEPATH/query/service \\\n     -H 'Content-Type: application/json'\
          \ \\\n     -d '{ \"statement\": \"SELECT name FROM `travel-sample`.inventory.hotel\
          \ LIMIT 1;\" }' \\\n     -u $USER:$PASSWORD"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: "get_service"
      summary: "GET-Only Query Service"
      description: "Enables you to execute a SQL++ statement.\nThis method allows\
        \ you to run SELECT queries and other DML statements, and specify query parameters.\n\
        \nThis endpoint is intended for situations where use of the `POST` method\
        \ is restricted."
      parameters:
      - name: "body"
        in: "query"
        required: true
        style: "form"
        explode: true
        description: "Specify the parameters in the query URL in URL-encoded format.\n\
          The format for URL-encoded parameters is consistent with the syntax for\
          \ variables according to RFC 6570."
        schema:
          $ref: "#/components/schemas/Request"
      security:
      - Header: []
      - Parameter: []
      x-codeSamples:
      - lang: "Shell"
        source: "curl -v $BASEPATH/query/service?statement=SELECT%20name%20FROM%20%60travel-sample%60.inventory.hotel%20LIMIT%201%3B\
          \ \\\n     -u $USER:$PASSWORD"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  responses:
    OK:
      description: "The operation was successful."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          example:
            requestID: "615e0b26-dd61-4a1a-bda9-22333193b982"
            signature:
              name: "json"
            results:
            - name: "Medway Youth Hostel"
            status: "success"
            metrics:
              elapsedTime: "5.232754ms"
              executionTime: "5.160022ms"
              resultCount: 1
              resultSize: 30
              serviceLoad: 12
    BadRequest:
      description: "Bad Request.\nThe request cannot be processed for one of the following\
        \ reasons:\nthe statement contains a SQL++ syntax error;\nthe request has\
        \ a missing or unrecognized HTTP parameter;\nthe request is badly formatted\
        \ &mdash; for example, the request body contains a JSON syntax error."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          examples:
            n1qlerror:
              summary: "SQL++ Error"
              value:
                requestID: "27087759-07af-431d-a3d7-29080f870e56"
                errors:
                - code: 3000
                  msg: "syntax error - line 1, column 7, near 'SLECT', at: name"
                status: "fatal"
                metrics:
                  elapsedTime: "1.478631ms"
                  executionTime: "1.393274ms"
                  resultCount: 0
                  resultSize: 0
                  serviceLoad: 12
                  errorCount: 1
            requesterror:
              summary: "Request Error"
              value:
                requestID: "424c0a6d-b851-4feb-892c-0d9a106f2e13"
                errors:
                - code: 1050
                  msg: "No statement or prepared value"
                status: "fatal"
                metrics:
                  elapsedTime: "1.124637ms"
                  executionTime: "1.094663ms"
                  resultCount: 0
                  resultSize: 0
                  serviceLoad: 0
                  errorCount: 1
    Unauthorized:
      description: "Unauthorized.\nThe credentials provided with the request are missing\
        \ or invalid."
    Forbidden:
      description: "Forbidden.\nA read-only violation occurred.\nEither there was\
        \ an attempt to create or update in a GET request or a POST request where\
        \ `readonly` is set, or the client does not have the authorization to modify\
        \ an object (index, keyspace or namespace) in the statement."
    NotFound:
      description: "Not found.\nThe statement in the request references an invalid\
        \ namespace or keyspace."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          example:
            requestID: "d30b805f-6c1e-44ec-9aec-35ff711a6e88"
            errors:
            - code: 12003
              msg: "Keyspace not found in CB datastore: default:travel-sample.inventory.motel"
            status: "fatal"
            metrics:
              elapsedTime: "3.096786ms"
              executionTime: "2.468282ms"
              resultCount: 0
              resultSize: 0
              serviceLoad: 12
              errorCount: 1
    MethodNotAllowed:
      description: "Method not allowed.\nThe statement in the request references an\
        \ invalid namespace or keyspace."
    Conflict:
      description: "Conflict.\nThe request attempted to create an object (keyspace\
        \ or index) that already exists."
    Gone:
      description: "Gone.\nThe server is shutting down gracefully.\nPreviously made\
        \ requests are being completed, but no new requests are being accepted."
    InternalServerError:
      description: "Internal server error.\nAn unforeseen problem occurred processing\
        \ the request."
    PayloadTooLarge:
      description: "Payload too large.\nThe query is too large for the Query Service\
        \ to process."
    ServiceUnavailable:
      description: "Service unavailable.\nAn issue (that's possibly temporary) is\
        \ preventing the request being processed; the request queue is full or the\
        \ data store is not accessible."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          example:
            requestID: "5c0a6a81-2fc8-4a33-a035-ed7fb1512710"
            errors:
            - code: "<int>"
              msg: "Request queue full"
            status: "errors"
            metrics:
              elapsedTime: "134.7944us"
              executionTime: "130.5518us"
              resultCount: 0
              resultSize: 0
              mutationCount: 0
              errorCount: 1
              warningCount: 0
  schemas:
    Request:
      type: "object"
      title: "Request Parameters"
      properties:
        args:
          type: "array"
          items: {}
          x-desc-name: "args"
          description: "Supplies the values for positional parameters in the statement.\n\
            Applicable if the statement or prepared statement contains 1 or more positional\
            \ parameters.\n\nThe value is an array of JSON values, one for each positional\
            \ parameter in the statement.\n\nFor more information, see [Named Parameters\
            \ and Positional Parameters][section_srh_tlm_n1b].\n\n[section_srh_tlm_n1b]:\
            \ ../n1ql/n1ql-manage/query-settings.html#section_srh_tlm_n1b"
          x-desc-refs: "[section_srh_tlm_n1b]: #section_srh_tlm_n1b"
          x-has-example: true
          example:
          - "LAX"
          - 6
        atrcollection:
          type: "string"
          x-desc-name: "atrcollection_req"
          description: "Specifies the collection where the [active transaction record][additional-storage-use]\
            \ (ATR) is stored.\nThe collection must be present.\nIf not specified,\
            \ the ATR is stored in the default collection in the default scope in\
            \ the bucket containing the first mutated document within the transaction.\n\
            \nThe value must be a string in the form `\"bucket.scope.collection\"\
            ` or `\"namespace:bucket.scope.collection\"`.\nIf any part of the path\
            \ contains a special character, that part of the path must be delimited\
            \ in backticks &grave;&grave;.\n\n[additional-storage-use]: /server/8.0/learn/data/transactions.html#active-transaction-record-entries"
          x-desc-more: "The [node-level][atrcollection-srv] `atrcollection` setting\
            \ specifies the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\n\n[atrcollection-srv]:\
            \ ../n1ql-rest-admin/index.html#atrcollection-srv"
          x-desc-refs: "[atrcollection-srv]: #atrcollection-srv"
          x-has-example: true
          example: "default:`travel-sample`.transaction.test"
        auto_execute:
          type: "boolean"
          x-desc-name: "auto_execute"
          description: "Specifies that prepared statements should be executed automatically\
            \ as soon as they're created.\nThis saves you from having to make two\
            \ separate requests in cases where you want to prepare a statement and\
            \ execute it immediately.\n\nFor more information, see [Auto-Execute][auto-execute].\n\
            \n[auto-execute]: ../n1ql/n1ql-language-reference/prepare.html#auto-execute"
          x-desc-refs: "[auto-execute]: ../n1ql-language-reference/prepare.html#auto-execute"
          x-has-default: true
          x-has-example: true
          default: false
          example: true
        client_context_id:
          type: "string"
          x-desc-name: "client_context_id"
          description: "A piece of data supplied by the client that's echoed in the\
            \ response, if present.\nSQL++ is agnostic about the content of this parameter;\
            \ it's just echoed in the response.\n\n* Maximum allowed size is 64 characters;\
            \ all others will be cut.\n* If it contains an escape character `/` or\
            \ quote `\"`, it will be rejected as error code 1110."
        compression:
          type: "string"
          x-desc-name: "compression"
          description: "Compression format to use for response data on the wire.\n\
            \nValues are case-insensitive."
          enum:
          - "ZIP"
          - "RLE"
          - "LZMA"
          - "LZO"
          - "NONE"
          x-has-default: true
          x-has-example: true
          default: "NONE"
          example: "zip"
        controls:
          type: "boolean"
          x-desc-name: "controls_req"
          description: "Specifies if there should be a controls section returned with\
            \ the request results.\n\nWhen set to `true`, the query response document\
            \ includes a controls section with runtime information provided along\
            \ with the request, such as positional and named parameters or settings.\n\
            \nIf the request qualifies for caching, these values will also be cached\
            \ in the `completed_requests` system keyspace."
          x-desc-more: "The [node-level][controls-srv] `controls` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting.\n\n[controls-srv]: ../n1ql-rest-admin/index.html#controls-srv"
          x-desc-refs: "[controls-srv]: #controls-srv"
          x-has-example: true
          example: true
        creds:
          x-desc-name: "creds"
          description: "In the Data API, this parameter is ignored and has no effect.\n\
            \nIn the cbq shell, this parameter specifies credentials within a session.\n\
            For more information, see [Switch Between Credentials](../n1ql-intro/cbq.html#cbq-multiple-creds)."
        durability_level:
          type: "string"
          x-desc-name: "durability_level"
          description: "The level of [durability][durability] for mutations produced\
            \ by the request.\n\nIf the request contains a `BEGIN TRANSACTION` statement,\
            \ or a DML statement with the `tximplicit` parameter set to `true`, the\
            \ durability level is specified for all mutations within that transaction.\n\
            \nDurability is also supported for non-transactional DML statements.\n\
            In this case, the `kvtimeout` parameter is used as the durability timeout.\n\
            \nIf not specified, the default durability level is `\"majority\"`.\n\
            Set the durability level to `\"none\"` or `\"\"` to specify no durability.\n\
            \n[durability]: /server/8.0/learn/data/durability.html"
          enum:
          - ""
          - "none"
          - "majority"
          - "majorityAndPersistActive"
          - "persistToMajority"
          x-has-default: true
          x-has-example: true
          default: "majority"
          example: "none"
        encoded_plan:
          type: "string"
          x-desc-name: "encoded_plan"
          description: "In clusters running Couchbase Server 6.5 and later, this parameter\
            \ is ignored and has no effect.\nIt's included for compatibility with\
            \ previous versions of Couchbase Server."
        encoding:
          type: "string"
          x-desc-name: "encoding"
          description: "Desired character encoding for the query results.\n\nOnly\
            \ possible value is `UTF-8` and is case-insensitive."
          x-has-default: true
          default: "UTF-8"
        format:
          type: "string"
          x-desc-name: "format"
          description: "Desired format for the query results.\n\nValues are case-insensitive."
          enum:
          - "JSON"
          - "XML"
          - "CSV"
          - "TSV"
          x-has-default: true
          x-has-example: true
          default: "JSON"
          example: "XML"
        kvtimeout:
          type: "string"
          x-desc-name: "kvtimeout"
          description: "The approximate time to wait for a KV get operation before\
            \ timing out.\nThis applies to statements within a transaction, and to\
            \ non-transactional statements, whether `durability_level` is set or not.\n\
            \nIf `use_replica` is enabled for a query, then this parameter also specifies\
            \ the approximate time to wait before fetching data from a replica vBucket\
            \ when the active vBucket is inaccessible.\n\nThe value for this parameter\
            \ is a string.\nIts format includes an amount and a mandatory unit, e.g.\
            \ `10ms` (10 milliseconds) or `0.5s` (half a second).\nValid units are:\n\
            \n* `ns` (nanoseconds)\n* `us` (microseconds)\n* `ms` (milliseconds)\n\
            * `s` (seconds)\n* `m` (minutes)\n* `h` (hours)\n\nSpecify a duration\
            \ of `0` or a negative duration to disable.\nWhen disabled, no timeout\
            \ is applied and the KV operation runs for however long it takes."
          x-has-default: true
          x-has-example: true
          default: "2.5s"
          example: "10ms"
        max_parallelism:
          type: "integer"
          format: "int32"
          x-desc-name: "max_parallelism_req"
          description: "Specifies the maximum parallelism for the query.\n\nThe default\
            \ value is the same as the number of partitions of the index selected\
            \ for the query."
          x-desc-more: "The [node-level][max-parallelism-srv] `max-parallelism` setting\
            \ specifies the ceiling for this parameter for a single node.\nIf the\
            \ request-level parameter is zero or negative, the parallelism for the\
            \ query is set to the node-level setting.\nIf the request-level parameter\
            \ is greater than zero and less than the node-level setting, the request-level\
            \ parameter overrides the node-level setting.\nIf the request-level parameter\
            \ is greater than the node-level setting, the parallelism for the query\
            \ is set to the node-level setting.\n\nIn addition, the [cluster-level][queryMaxParallelism]\
            \ `queryMaxParallelism` setting specifies the ceiling for this parameter\
            \ for the whole cluster.\nWhen you change the cluster-level setting, the\
            \ node-level setting is overwritten for all nodes in the cluster.\n\n\
            To enable queries to run in parallel, you must specify the cluster-level\
            \ `queryMaxParallelism` parameter, or specify the node-level `max-parallelism`\
            \ parameter on all Query nodes.\n\n[max-parallelism-srv]: ../n1ql-rest-admin/index.html#max-parallelism-srv\n\
            [queryMaxParallelism]: ../n1ql-rest-settings/index.html#queryMaxParallelism"
          x-desc-refs: "[max-parallelism-srv]: #max-parallelism-srv\n[queryMaxParallelism]:\
            \ #queryMaxParallelism"
          x-has-example: true
          example: 3
        memory_quota:
          type: "integer"
          format: "int32"
          x-desc-name: "memory_quota_req"
          description: "Specifies the maximum amount of memory the request may use,\
            \ in MB.\n\nSpecify `0` (the default value) to disable.\nWhen disabled,\
            \ there is no quota.\n\nThis parameter enforces a ceiling on the memory\
            \ used for the tracked documents required for processing a request.\n\
            It does not take into account any other memory that might be used to process\
            \ a request, such as the stack, the operators, or some intermediate values.\n\
            \nWithin a transaction, this setting enforces the memory quota for the\
            \ transaction by tracking the\ndelta table and the transaction log (approximately)."
          x-desc-more: "The [node-level][memory-quota-srv] `memory-quota` setting\
            \ specifies the ceiling for this parameter for a single node.\nIf the\
            \ node-level setting is zero (the default), the request-level parameter\
            \ overrides the node-level setting.\nIf the node-level setting is greater\
            \ than zero, the request-level parameter is capped by the node-level setting.\n\
            \nIn addition, the [cluster-level][queryMemoryQuota] `queryMemoryQuota`\
            \ setting specifies the ceiling for this parameter for the whole cluster.\n\
            When you change the cluster-level setting, the node-level setting is overwritten\
            \ for all nodes in the cluster.\n\n[memory-quota-srv]: ../n1ql-rest-admin/index.html#memory-quota-srv\n\
            [queryMemoryQuota]: ../n1ql-rest-settings/index.html#queryMemoryQuota"
          x-desc-refs: "[memory-quota-srv]: #memory-quota-srv\n[queryMemoryQuota]:\
            \ #queryMemoryQuota"
          x-has-default: true
          x-has-example: true
          default: 0
          example: 4
        metrics:
          type: "boolean"
          x-desc-name: "metrics"
          description: "Specifies that metrics should be returned with query results."
          x-has-default: true
          x-has-example: true
          default: true
          example: false
        namespace:
          type: "string"
          x-desc-name: "namespace"
          description: "Specifies the namespace to use.\nCurrently, only the `default`\
            \ namespace is available."
          x-has-example: true
          example: "default"
        natural:
          type: "string"
          x-desc-name: "natural"
          x-desc-status: "Couchbase Server 8.0"
          description: "The prompt for a natural language request.\nThe Query Service\
            \ uses the prompt to generate a SQL++ statement.\n\nIf the generated statement\
            \ is a SELECT statement, the generated statement is returned and executed\
            \ automatically.\n\nIf the generated statement is not a SELECT statement,\
            \ the generated statement is returned, but not executed.\nIn this case,\
            \ you must verify the statement and execute it in a separate request.\n\
            \nNatural language requests use the Couchbase Capella iQ service as a\
            \ backend.\nTo make a natural language request, you must have a Couchbase\
            \ Capella user account.\n\nThis parameter is available in clusters running\
            \ Couchbase Server 8.0 and later.\n\nTo use this parameter, you must also\
            \ specify the `natural_cred`, `natural_orgid`, and `natural_context` parameters.\n\
            If you don't specify all four parameters, the Query Service returns an\
            \ error."
          x-has-example: true
          example: "Show me count of airlines per country"
        natural_cred:
          type: "string"
          format: "password"
          x-desc-name: "natural_cred"
          x-desc-status: "Couchbase Server 8.0"
          description: "The Couchbase Capella user account credentials for a natural\
            \ language request, in the form `username:password`.\nBe careful not to\
            \ expose the credentials in log files or other output.\n\nThis parameter\
            \ does not support single sign-on (SSO), multi-factor authentication (MFA),\
            \ or social login credentials such as Google or GitHub.\n\nNatural language\
            \ requests use the Couchbase Capella iQ service as a backend.\nTo make\
            \ a natural language request, you must have a Couchbase Capella user account.\n\
            \nThis parameter is available in clusters running Couchbase Server 8.0\
            \ and later.\n\nTo use this parameter, you must also specify the `natural`,\
            \ `natural_orgid`, and `natural_context` parameters.\nIf you don't specify\
            \ all four parameters, the Query Service returns an error."
          x-has-example: true
          example: "username:password"
        natural_orgid:
          type: "string"
          format: "uuid"
          x-desc-name: "natural_orgid"
          x-desc-status: "Couchbase Server 8.0"
          description: "The Couchbase Capella organization ID for a natural language\
            \ request.\n\nNatural language requests use the Couchbase Capella iQ service\
            \ as a backend.\nTo make a natural language request, you must have a Couchbase\
            \ Capella user account.\n\nThis parameter is available in clusters running\
            \ Couchbase Server 8.0 and later.\n\nTo use this parameter, you must also\
            \ specify the `natural`, `natural_cred`, and `natural_context` parameters.\n\
            If you don't specify all four parameters, the Query Service returns an\
            \ error."
        natural_context:
          type: "string"
          x-desc-name: "natural_context"
          x-desc-status: "Couchbase Server 8.0"
          description: "A list of paths specifying keyspaces for a natural language\
            \ request.\nThe Query Service infers the schema of each keyspace, in order\
            \ to give more precise responses from the natural language request.\n\n\
            The parameter may contain up to four paths, separated by commas.\nSpaces\
            \ are allowed.\nEach path may be:\n\n* A full path, in the form `bucket.scope.collection`\
            \ or `namespace:bucket.scope.collection`.\n\n* A path prefix, in the form\
            \ `namespace:bucket` or `bucket`, to specify the default collection in\
            \ the default scope.\n\n* A partial path, in the form `collection`.\n\
