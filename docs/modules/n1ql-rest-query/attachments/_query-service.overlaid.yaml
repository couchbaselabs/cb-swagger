          example: "default:travel-sample.inventory"
        readonly:
          type: "boolean"
          x-desc-name: "readonly"
          description: "Controls whether a query can change a resulting recordset.\n\
            \nIf `readonly` is `true`, then the following statements are not allowed:\n\
            \n* CREATE INDEX\n* DROP INDEX\n* INSERT\n* MERGE\n* UPDATE\n* UPSERT\n\
            \nWhen using GET requests, it's best to set `readonly` to `true`."
          x-has-default: true
          x-has-example: true
          default: false
          example: true
        scan_cap:
          type: "integer"
          format: "int32"
          x-desc-name: "scan_cap_req"
          description: "Maximum buffered channel size between the indexer client and\
            \ the Query Service for index scans.\nThis parameter controls when to\
            \ use scan backfill.\n\nUse `0` or a negative number to disable.\nSmaller\
            \ values reduce GC, while larger values reduce indexer backfill."
          x-desc-more: "The [node-level][scan-cap-srv] `scan-cap` setting specifies\
            \ the default for this parameter for a single node.\nThe request-level\
            \ parameter overrides the node-level setting, but only if it is lower\
            \ than the node-level setting.\n\nIn addition, the [cluster-level][queryScanCap]\
            \ `queryScanCap` setting specifies the default for this parameter for\
            \ the whole cluster.\nWhen you change the cluster-level setting, the node-level\
            \ setting is overwritten for all nodes in the cluster.\n\n[scan-cap-srv]:\
            \ ../n1ql-rest-admin/index.html#scan-cap-srv\n[queryScanCap]: ../n1ql-rest-settings/index.html#queryScanCap"
          x-desc-refs: "[scan-cap-srv]: #scan-cap-srv\n[queryScanCap]: #queryScanCap"
          x-has-example: true
          example: 1024
        scan_consistency:
          type: "string"
          x-desc-name: "scan_consistency"
          description: "Specifies the consistency guarantee or constraint for index\
            \ scanning.\nThe valid values are:\n\n* `not_bounded` &mdash;\nNo timestamp\
            \ vector is used in the index scan.\nThis is the fastest mode, because\
            \ it avoids the costs of obtaining the vector and waiting for the index\
            \ to catch up to the vector.\n\n* `at_plus` &mdash;\nThis implements bounded\
            \ consistency.\nWhen scan consistency is set to `at_plus`, you must also\
            \ specify the `scan_vector` parameter for queries using a single keyspace,\
            \ or the `scan_vectors` parameter for queries using multiple keyspaces.\n\
            This is used as a lower bound for the statements in the request.\nYou\
            \ can use this setting to implement read-your-own-writes (RYOW).\n\n*\
            \ `request_plus` &mdash;\nThis implements strong consistency per request.\n\
            Before processing the request, a current vector is obtained.\nThe vector\
            \ is used as a lower bound for the statements in the request.\nIf there\
            \ are DML statements in the request, RYOW is also applied within the request.\n\
            (If `request_plus` is specified in a query that runs during a failover\
            \ of an index node, the query waits until the rebalance operation completes\
            \ and the index data has rebalanced before returning a result.)\n\n* `statement_plus`\
            \ &mdash;\nThis implements strong consistency per statement.\nBefore processing\
            \ each statement, a current vector is obtained and used as a lower bound\
            \ for that statement.\n\nValues are case-insensitive.\n\nIf the request\
            \ contains a `BEGIN TRANSACTION` statement, or a DML statement with the\
            \ `tximplicit` parameter set to `true`, then this parameter sets the transactional\
            \ scan consistency.\nFor more information, see [Transactional Scan Consistency][transactional-scan-consistency].\n\
            \nThe default transactional scan consistency is RYOW for each statement\
            \ within the transaction.\nIf you want to disable RYOW for a statement\
            \ within the transaction, set `scan_consistency` for that statement to\
            \ `not_bounded`.\n\n[transactional-scan-consistency]: ../n1ql/n1ql-manage/query-settings.html#transactional-scan-consistency"
          x-desc-refs: "[transactional-scan-consistency]: #transactional-scan-consistency"
          enum:
          - "not_bounded"
          - "at_plus"
          - "request_plus"
          - "statement_plus"
          x-has-default: true
          x-has-example: true
          default: "not_bounded"
          example: "at_plus"
        scan_vector:
          $ref: "#/components/schemas/RequestScanVector"
        scan_vectors:
          $ref: "#/components/schemas/RequestScanVectors"
        scan_wait:
          type: "string"
          format: "duration"
          x-desc-name: "scan_wait"
          description: "Can be supplied with `scan_consistency` values of `request_plus`,\
            \ `statement_plus` and `at_plus`.\n\nSpecifies the maximum time the client\
            \ is willing to wait for an index to catch up to the vector timestamp\
            \ in the request.\n\nSpecifies how much time the client is willing to\
            \ wait for the indexer to satisfy the required `scan_consistency` and\
            \ `scan_vector` criteria.\nAfter receiving the scan request, if the indexer\
            \ is unable to catch up within the `scan_wait` time and start the scan,\
            \ the indexer aborts with an error and the scan fails.\n\nIts format includes\
            \ an amount and a mandatory unit, e.g. `10ms` (10 milliseconds) or `0.5s`\
            \ (half a second).\nValid units are:\n\n* `ns` (nanoseconds)\n* `us` (microseconds)\n\
            * `ms` (milliseconds)\n* `s` (seconds)\n* `m` (minutes)\n* `h` (hours)\n\
            \nSpecify `0` or a negative integer to disable."
          x-has-default: true
          x-has-example: true
          default: ""
          example: "30m"
        signature:
          type: "boolean"
          x-desc-name: "signature"
          description: "Include a header for the results schema in the response."
          x-has-default: true
          x-has-example: true
          default: true
          example: false
        sort_projection:
          type: "boolean"
          x-desc-name: "sort_projection"
          description: "If `true`, causes statement projection terms to be sorted\
