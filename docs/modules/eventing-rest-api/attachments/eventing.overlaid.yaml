      description: "For scoped functions only.\nThe bucket to which the function belongs."
      explode: true
      in: "query"
      name: "bucket"
      required: false
      schema:
        type: "string"
      style: "form"
    QueryScope:
      description: "For scoped functions only.\nThe scope to which the function belongs."
      explode: true
      in: "query"
      name: "scope"
      required: false
      schema:
        type: "string"
      style: "form"
    QueryFunction:
      description: "The name of a function."
      explode: true
      in: "query"
      name: "name"
      required: true
      schema:
        type: "string"
      style: "form"
    QueryAggregate:
      description: "If `false`, the API accesses a single Eventing node.\nIf `true`,\
        \ the API accesses all Eventing nodes."
      explode: true
      x-has-default: true
      in: "query"
      name: "aggregate"
      required: false
      schema:
        default: false
        type: "boolean"
      style: "form"
    QuerySize:
      description: "The approximate amount of logging information returned.\nWhen\
        \ fetching from more than one Eventing node, the amount of logging information\
        \ returned from each node is the `size` divided by the number of nodes."
      explode: true
      x-has-default: true
      in: "query"
      name: "size"
      required: false
      schema:
        default: 40960
        type: "integer"
      style: "form"
  responses:
    OK:
      description: "Success."
    Goof:
      description: "Failure."
  schemas:
    settings_schema:
      additionalProperties: false
      example:
        n1ql_prepare_all: false
        high_seq_check_interval: 5
        bucket_cache_age: 1
        description: "description"
        sock_batch_size: 1
        user_prefix: "eventing"
        cursor_aware: false
        max_unacked_count: 9
        cpp_worker_thread_count: 1
        lcb_inst_capacity: 1
        on_deploy_timeout: 1
        handler_headers:
        - "handler_headers"
        - "handler_headers"
        language_compatibility: "7.2.0"
        handler_footers:
        - "handler_footers"
        - "handler_footers"
        app_log_dir: "app_log_dir"
        curl_max_allowed_resp_size: 4
        processing_status: false
        cursor_checkpoint_timeout: 1
        app_log_max_files: 1
        bucket_cache_size: 20971520
        execution_timeout: 1
        lcb_retry_count: 0
        max_unacked_bytes: 9
        allow_transaction_mutations: false
        max_parallel_vb: 8
        worker_count: 1
        timer_context_size: 15490161
        enable_applog_rotation: true
        log_level: "INFO"
        deployment_status: false
        n1ql_consistency: "none"
        checkpoint_interval: 1
        message_flush_time: 6
        num_timer_partitions: 3
        dcp_stream_boundary: "everything"
        lcb_timeout: 1
        tick_duration: 4
        allow_sync_documents: false
        app_log_max_size: 1024
      properties:
        cpp_worker_thread_count:
          default: 2
          description: "number of threads each worker utilizes"
          minimum: 1
          type: "integer"
        dcp_stream_boundary:
          default: "everything"
          description: "indicates where to start dcp stream from (beginning of time,\
            \ present point) 'from_prior' is deprecated in 6.6.2"
          enum:
          - "everything"
          - "from_now"
          type: "string"
        deployment_status:
          default: false
          description: "indicates if the function is deployed. true=deployed, false=undeployed"
          type: "boolean"
        description:
          description: "free form text for user to describe the handler. no functional\
            \ role"
          type: "string"
        execution_timeout:
          default: 60
          description: "maximum time the handler can run before it is forcefully terminated\
            \ (in seconds)"
          minimum: 1
          type: "integer"
        cursor_checkpoint_timeout:
          default: 60
          description: "The maximum time the checkpoint writer can run before it's\
            \ forcefully terminated (in seconds)."
          minimum: 1
          type: "integer"
          x-desc-status: "Couchbase Server 7.6.4"
        on_deploy_timeout:
          default: 60
          description: "maximum time the OnDeploy handler can run before it is terminated\
            \ (in seconds)"
          minimum: 1
          type: "integer"
        language_compatibility:
          default: "7.2.0"
          description: "eventing language version this handler assumes in terms of\
            \ syntax and behavior"
          enum:
          - "6.6.2"
          - "6.0.0"
          - "6.5.0"
          - "7.2.0"
          type: "string"
        lcb_inst_capacity:
          default: 10
          description: "maximum number of libcouchbase connections that may be opened\
            \ and pooled"
          minimum: 1
          type: "integer"
        lcb_retry_count:
          default: 0
          description: "number of retries of retriable libcouchbase failures. 0 keeps\
            \ trying till execution_timeout"
          minimum: 0
          type: "integer"
        lcb_timeout:
          default: 5
          description: "maximum time the lcb command is waited until completion before\
            \ we terminate the request(in seconds)"
          minimum: 1
          type: "integer"
        log_level:
          default: "INFO"
          description: "level of detail in system logging"
          enum:
          - "INFO"
          - "ERROR"
          - "WARNING"
          - "DEBUG"
          - "TRACE"
          type: "string"
        n1ql_consistency:
          default: "none"
          description: "consistency level used by n1ql statements in the handler"
          enum:
          - "none"
          - "request"
          type: "string"
        num_timer_partitions:
          description: "number of timer shards. defaults to number of vbuckets"
          enum:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 32
          - 64
          - 128
          - 256
          - 512
          - 1024
          type: "integer"
        processing_status:
          default: false
          description: "indicates if the function is running (i.e., not paused). true=running,\
            \ false=paused"
          type: "boolean"
        sock_batch_size:
          description: "batch size for messages from producer to consumer. normally,\
            \ this must not be specified"
          minimum: 1
          type: "integer"
        tick_duration:
          default: 60000
          description: "duration to log stats from this handler, in milliseconds"
          type: "integer"
        timer_context_size:
          default: 1024
          description: "size limit of timer context object"
          maximum: 20971520
          minimum: 20
          type: "integer"
        user_prefix:
          default: "eventing"
          description: "key prefix for all data stored in metadata by this handler"
          minLength: 1
          type: "string"
        worker_count:
          default: 1
          description: "number of worker processes handler utilizes on each eventing\
            \ node"
          minimum: 1
          type: "integer"
        n1ql_prepare_all:
          default: false
          description: "automatically prepare all n1ql statements in the handler"
          type: "boolean"
        handler_headers:
          description: "code to automatically prepend to top of handler code"
          items:
            type: "string"
          type: "array"
        handler_footers:
          description: "code to automatically append to bottom of handler code"
          items:
            type: "string"
          type: "array"
        enable_applog_rotation:
          default: true
          description: "enable rotating this handlers log() message files"
          type: "boolean"
        app_log_dir:
          description: "directory to write content of log() message files"
          type: "string"
        app_log_max_size:
          default: 41943040
          description: "rotate logs when file grows to this size in bytes approximately"
          minimum: 1024
          type: "integer"
        app_log_max_files:
          default: 10
          description: "number of log() message files to retain when rotating"
          minimum: 1
          type: "integer"
        checkpoint_interval:
          default: 60
          description: "number of seconds before writing a progress checkpoint"
          minimum: 1
          type: "integer"
        bucket_cache_size:
          default: 67108864
          description: "maximum size in bytes the bucket cache can grow to"
          minimum: 20971520
          type: "integer"
        bucket_cache_age:
          default: 1000
          description: "time in milliseconds after which a cached bucket object is\
            \ considered stale"
          minimum: 1
          type: "integer"
        curl_max_allowed_resp_size:
          default: 100
          description: "maximum allowable curl call response in 'MegaBytes'. Setting\
