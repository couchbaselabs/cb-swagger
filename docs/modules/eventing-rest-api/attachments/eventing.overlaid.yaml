openapi: "3.0.3"
info:
  description: "The Eventing REST API provides methods to work with and manipulate\
    \ Couchbase Eventing functions."
  license:
    name: "Business Source License 1.1"
    url: "https://github.com/couchbaselabs/cb-swagger/blob/release/7.6/licenses/BSL-Couchbase.txt"
  title: "Eventing REST API"
  version: "7.6"
servers:
- description: "The URL scheme, host, and port are as follows."
  url: "{scheme}://{host}:{port}"
  variables:
    scheme:
      default: "http"
      description: "The URL scheme.\nUse `https` for secure access."
      enum:
      - "http"
      - "https"
    host:
      default: "localhost"
      description: "The host name or IP address of a node running the Eventing Service."
    port:
      default: "8096"
      description: "The Eventing Service REST port.\nUse `18096` for secure access."
      enum:
      - "8096"
      - "18096"
paths:
  /api/v1/functions/{function}/deploy:
    post:
      description: "Deploys an undeployed function.\nThis is the preferred invocation."
      operationId: "basic_deploy"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
      security:
      - Global: []
      - Scoped: []
      summary: "Deploy a Function"
      tags:
      - "activation"
  /api/v1/functions/{function}/undeploy:
    post:
      description: "Undeploys a function.\nThis is the preferred invocation."
      operationId: "basic_undeploy"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
      security:
      - Global: []
      - Scoped: []
      summary: "Undeploy a Function"
      tags:
      - "activation"
  /api/v1/functions/{function}/pause:
    post:
      description: "Pauses a function and creates a DCP checkpoint such that on a\
        \ subsequent resume no mutations will be lost.\nThis is the preferred invocation."
      operationId: "basic_pause"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
      security:
      - Global: []
      - Scoped: []
      summary: "Pause a Function"
      tags:
      - "activation"
  /api/v1/functions/(function}/resume:
    post:
      description: "Resumes a paused function from its paused DCP checkpoint.\nThis\
        \ is the preferred invocation."
      operationId: "basic_resume"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Resume a Function"
      tags:
      - "activation"
  /api/v1/functions/{function}:
    delete:
      description: "Deletes a specific function from the cluster.\n\nUse this API\
        \ with caution, as it's irreversible."
      operationId: "adv_function_zap"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Delete Function"
      tags:
      - "advanced"
    get:
      description: "Provides a listing of a complete function definition available\
        \ in the cluster.\nThe function could be in any state: deployed, undeployed,\
        \ or paused.\nIf saved to a file the function definition can be imported into\
        \ the cluster or a different cluster.\nHowever any changes to the function\
        \ definition made to the file outside the UI are discouraged."
      operationId: "adv_function_view"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler_schema"
          description: "Returns a single function definition object."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "View a Function"
      tags:
      - "advanced"
    post:
      description: "Creates or imports a single function."
      operationId: "adv_function_import"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFunction"
        description: "A single function definition object, or an array containing\
          \ a single function definition object.\nThe function name in the definition\
          \ object must match that given by the path parameter."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Create or Import a Function"
      tags:
      - "advanced"
  /api/v1/functions:
    delete:
      description: "Deletes **all functions** from the cluster.\nUse this API with\
        \ caution, as it's irreversible.\n\nIf this API is run as a non-Administrator\
        \ the deleted set will be filtered via RBAC to include only the function scopes\
        \ the user has access to."
      operationId: "adv_function_zap_all"
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "Delete Multiple Functions"
      tags:
      - "advanced"
    get:
      description: "Provides an array of definitions of all functions available in\
        \ the cluster.\nThe functions may be in any state: deployed, undeployed, or\
        \ paused.\nIf saved to a file the function definitions can be imported into\
        \ the cluster or a different cluster.\nHowever any changes to the function\
        \ definition made to the file outside the UI are discouraged.\n\nIf this API\
        \ is run as a non-Administrator, the results are filtered via RBAC to include\
        \ only the function scopes the user has access to."
      operationId: "adv_function_view_all"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handler_schema"
                type: "array"
          description: "Returns an array containing one or more function definition\
            \ objects."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "View Multiple Functions"
      tags:
      - "advanced"
    post:
      description: "Creates or imports multiple functions.\n\nIf any function's `language_compatibility`\
        \ field is missing, the value will be set to the highest version supported\
        \ by the server, unlike [Import Multiple Functions](#adv_multiple_import)."
      operationId: "adv_function_import_all"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFunctions"
        description: "A single function definition object, or an array containing\
          \ one or more function definition objects.\n\nFunction names must be unique.\n\
          When multiple functions have the same name, an error is reported."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "Create or Import Multiple Functions"
      tags:
      - "advanced"
  /api/v1/import:
    post:
      description: "Imports multiple functions.\n\nIf any function's `language_compatibility`\
        \ field is missing, the value will be set to 6.0.0, unlike [Create or Import\
        \ Multiple Functions](#adv_function_import_all)."
      operationId: "adv_multiple_import"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFunctions"
        description: "A single function definition object, or an array containing\
          \ one or more function definition objects.\n\nFunction names must be unique.\n\
          When multiple functions have the same name, an error is reported."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "Import Multiple Functions"
      tags:
      - "advanced"
  /api/v1/export:
    get:
      description: "This is a convenience method to export all function definitions.\n\
        Exported functions are always set to the undeployed state at the time of export,\
        \ regardless of their state in the cluster.\nIf saved to a file the function\
        \ definitions can be imported into the cluster or a different cluster.\nHowever\
        \ any changes to the function definition made to the file outside the UI are\
        \ discouraged.\n\nIf this API is run as a non-Administrator the results are\
        \ filtered via RBAC to include only the function scopes the user has access\
        \ to."
      operationId: "adv_multiple_export"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handler_schema"
                type: "array"
          description: "Returns an array containing one or more function definition\
            \ objects."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "Export Multiple Functions"
      tags:
      - "advanced"
  /api/v1/functions/{function}/settings:
    get:
      description: "Return or export the full settings for one eventing function in\
        \ the cluster.\nThe settings can be subsequently imported.\nHowever any changes\
        \ to the function settings made to the file outside the UI are discouraged."
      operationId: "adv_settings_get"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/settings_schema"
          description: "Returns an object showing settings for the specified function."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "View Function Settings"
      tags:
      - "advanced"
    post:
      description: "Updates an undeployed or paused function with the provided settings.\n\
        You can only alter settings when the function is paused or undeployed; attempting\
        \ to adjust a deployed function will result in an error.\nDuring an edit,\
        \ settings provided are merged.\nUnspecified attributes retain their prior\
        \ values.\n\nYou must always specify `deployment_status` and `processing_status`\
        \ when using this REST endpoint to update any option or set of options.\n\
        To get the current values of `deployment_status` and `processing_status`,\
        \ see [View All Functions Status](#status_all) or [View Function Status](#status_function).\n\
        \nBy adjusting `deployment_status` and `processing_status` this command can\
        \ also deploy or resume a function; however, it cannot pause or undeploy a\
        \ function."
      operationId: "adv_settings_update"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/settings_schema"
        description: "An object providing settings for the specified function."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Update Function Settings"
      tags:
      - "advanced"
  /api/v1/functions/{function}/config:
    get:
      description: "Export or return the configuration of the source keyspace and\
        \ the eventing storage (metadata) keyspace for the specified function.\nThe\
        \ definition can be subsequently imported.\nHowever any changes to the function\
        \ definition made to the file outside the UI are discouraged."
      operationId: "adv_structure_get"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/depcfg_schema"
          description: "Returns an object showing the configuration of the specified\
            \ function."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "View Function Config"
      tags:
      - "advanced"
    post:
      description: "Import the configuration and alter the source keyspace and the\
        \ eventing storage (metadata) keyspace for the specified function.\nYou can\
        \ only change these values if a function is in the undeployed state and the\
        \ two keyspaces exist."
      operationId: "adv_structure_update"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/depcfg_schema"
        description: "An object providing the configuration for the specified function."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Update Function Config"
      tags:
      - "advanced"
  /api/v1/functions/{function}/appcode:
    get:
      description: "Export only the JavaScript code for the specified function.\n\
        Unlike [View a Function](#adv_function_view), the JavaScript is not escaped,\
        \ and the code is runnable in other environments.\nThe JavaScript code can\
        \ be subsequently imported.\nHowever any changes to the function definition\
        \ made to the file outside the UI are discouraged."
      operationId: "adv_text_get"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCode"
          description: "Returns a string showing the code for the specified function."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "View Function Code"
      tags:
      - "advanced"
    post:
      description: "Import only the JavaScript code for the specified function.\n\
        Unlike [Create or Import Function](#adv_function_import), the JavaScript is\
        \ not escaped and could come from other environments.\nIt is highly recommended\
        \ that you use the flag `--data-binary` or `--upload-file` when importing\
        \ your JavaScript appcode fragments to avoid potential encoding issues due\
        \ to string escaping."
      operationId: "adv_text_update"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCode"
        description: "A string providing the code for the specified function."
        required: true
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "Update Function Code"
      tags:
      - "advanced"
  /api/v1/status:
    get:
      description: "Returns a list (array) of all eventing functions, showing their\
        \ corresponding `composite_status`.\nA function's status can have one of the\
        \ following values: undeployed, deploying, deployed, undeploying, paused,\
        \ and pausing.\nThere's no value of resuming; when resuming a paused eventing\
        \ function, the `composite_status` returns `deploying` until it reaches the\
        \ deployed state.\n\nIf this API is run as a non-Administrator, the results\
        \ are filtered via RBAC to include only the function scopes the user has access\
        \ to."
      operationId: "status_all"
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Unscoped: []
      summary: "View All Functions Status"
      tags:
      - "status"
  /api/v1/status/{function}:
    get:
      description: "Returns the specified function, showing its corresponding `composite_status`.\n\
        It can have one of the following values: undeployed, deploying, deployed,\
        \ undeploying, paused, and pausing.\nThere's no value of resuming; when resuming\
        \ a paused eventing function, the `composite_status` returns `deploying` until\
        \ it reaches the deployed state."
      operationId: "status_function"
      parameters:
      - description: "The name of a function."
        explode: false
        in: "path"
        name: "function"
        required: true
        schema:
          type: "string"
        style: "simple"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      responses:
        "200":
          description: "Success."
        "404":
          description: "Failure."
      security:
      - Global: []
      - Scoped: []
      summary: "View Function Status"
      tags:
      - "status"
  /getAppLog:
    get:
      description: "Returns the most recent application log messages for the specified\
        \ function."
      operationId: "log_view"
      parameters:
      - description: "The name of a function."
        explode: true
        in: "query"
        name: "name"
        required: true
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe bucket to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "bucket"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "For scoped functions only.\nThe scope to which the function\
          \ belongs."
        explode: true
        in: "query"
        name: "scope"
        required: false
        schema:
          type: "string"
        style: "form"
      - description: "If `false`, the API accesses a single Eventing node.\nIf `true`,\
          \ the API accesses all Eventing nodes."
        explode: true
        x-has-default: true
        in: "query"
        name: "aggregate"
        required: false
        schema:
          default: false
          type: "boolean"
