  securitySchemes:
    Global:
      description: "Global functions with a function scope of ``*.*`` can only be\
        \ made or managed by users with the Full Admin or Eventing Full Admin role.\n\
        For global functions, you do not need to pass the `bucket` and `scope` query\
        \ parameters to specify the function scope.\nThe credentials must be an administrator\
        \ username and password.\n\nThis is the default function scope for all functions\
        \ after an upgrade from a prior version."
      scheme: "basic"
      type: "http"
    Scoped:
      description: "For scoped functions, you must pass the `bucket` and `scope` query\
        \ parameters to specify the function scope.\nThe credentials are the username\
        \ and password of any authorized user.\n\nYou can quote the REST call on the\
        \ command line to escape the `&` and `?` characters."
      scheme: "basic"
      type: "http"
    Unscoped:
      description: "Unscoped REST API calls do not require you to specify the function\
        \ scope.\nThe action is fully determined by the username and password credentials\
        \ passed to the REST call."
      scheme: "basic"
      type: "http"
