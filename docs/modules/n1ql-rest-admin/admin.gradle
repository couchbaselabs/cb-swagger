plugins {
  id "com.github.node-gradle.node" version "7.1.0"
}

apply plugin: 'org.openapi.generator'

// This spec contains the most irritating auto-generated examples, so we skip them and fetch from upstream

tasks.register('getExamples') {
  doLast {
    ant.property(name: "srcUrl",
                value: "${queryAdminExamples}")
    ant.echo("Fetching from ${ant.srcUrl}")
    ant.get(dest: "examples", ignoreerrors: "true") {
      ant.url(url: "${ant.srcUrl}/get_debug_vars.html")
      ant.url(url: "${ant.srcUrl}/get_gc.json")
      ant.url(url: "${ant.srcUrl}/get_ping.json")
      ant.url(url: "${ant.srcUrl}/post_gc.json")
    }
  }
}

task bundleSpec(type: NpxTask) {
  command = '@redocly/cli'
  args = [
    'bundle',
    "${queryAdminSpec}",
    '-o', "attachments/_${project.name}.bundle.yaml"]
}

openApiGenerate {
    generatorName = "asciidoc"
    inputSpec = file("attachments/_${project.name}.bundle.yaml").getAbsolutePath().toString()
    outputDir = "${projectDir}/pages"
    templateDir = "${rootDir}/templates"
    gitRepoId = "query"
    gitUserId = "couchbase"
    additionalProperties = [
            serviceDesc: "_${project.name}.bundle.yaml",
            specDir: "${projectDir}/partials/",
            snippetDir: "${projectDir}/partials/paths/",
            headerAttributes: "true",
            useIntroduction: "true",
            useTableTitles: "true",
            skipExamples: "true",
            legacyDiscriminatorBehavior: "true"
    ]
    globalProperties = [
            generateAliasAsModel: "true"
    ]
    generateAliasAsModel = true
    engine = "handlebars"
}

tasks.bundleSpec.dependsOn(getExamples)
tasks.openApiGenerate.dependsOn(bundleSpec)